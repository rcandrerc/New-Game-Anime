<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shino — demonstração</title>
<style>
  html,body{margin:0;height:100%;background:#1d2330;color:#eee;font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #ui button{background:#2d3547;color:#eee;border:1px solid #4a5570;border-radius:8px;padding:8px 10px;font:inherit}
  #ui button.on{background:#e8a33a;color:#111;border-color:#e8a33a}
  #msg{position:fixed;top:8px;left:0;right:0;text-align:center;opacity:.8}
</style></head>
<body>
<div id="msg">carregando a Shino…</div>
<div id="ui"></div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="../personagem/vrm_char.js"></script>
<script>
// Demonstração: a Shino com as animações e a física de cabelo/saia (personagem/vrm_char.js).
// Arraste pra girar a câmera. Abra por um servidor (ex.: "python3 -m http.server" na raiz do repositório), não direto do arquivo.
const NOMES = { Idle_A: 'Parada', Walking_A: 'Andar', Running_A: 'Correr', Jump_Idle: 'No ar', Fall_Idle: 'Queda',
  Jump_Full_Short: 'Cambalhota', Dodge_Forward: 'Dash', Melee_1H_Attack_Slice_Diagonal: 'Ataque', Melee_2H_Attack_Spin: 'Giro',
  Melee_Block: 'Defesa', Ranged_Magic_Shoot: 'Magia', Ranged_Magic_Spellcasting: 'Conjurar', Interact: 'Interagir', PickUp: 'Pegar',
  Chopping: 'Machado', Pickaxing: 'Picareta', Sit_Floor_Idle: 'Sentar no chão', Sit_Chair_Idle: 'Sentar na cadeira',
  Ranged_Magic_Spellcasting_Long: 'Conjurar longo', Ranged_Magic_Summon: 'Invocar', Ranged_Magic_Raise: 'Curar', Hit_A: 'Dano', Death_A: 'Morte' };
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.prepend(r.domElement);
r.outputEncoding = THREE.sRGBEncoding;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1d2330);
sc.add(new THREE.HemisphereLight(0xfff4e8, 0x40485a, 1.1)); const sol = new THREE.DirectionalLight(0xffffff, 0.9); sol.position.set(2, 4, 3); sc.add(sol);
const chao = new THREE.Mesh(new THREE.CircleGeometry(2, 48), new THREE.MeshStandardMaterial({ color: 0x262d3c })); chao.rotation.x = -Math.PI / 2; sc.add(chao);
const cam = new THREE.PerspectiveCamera(35, 1, 0.05, 50); let ang = 0.5, alt = 1.1, dist = 4.6;
function tam() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() } addEventListener('resize', tam); tam();
let px = null; r.domElement.addEventListener('pointerdown', e => px = e.clientX);
addEventListener('pointermove', e => { if (px != null) { ang -= (e.clientX - px) * 0.01; px = e.clientX } }); addEventListener('pointerup', () => px = null);
addEventListener('wheel', e => dist = Math.min(8, Math.max(1.5, dist + e.deltaY * 0.003)));

let mix, R, atual;
new THREE.GLTFLoader().load('../personagem/shino.glb', gl => {
  const A = VRMC.prep(gl), root = A.gl.scene; root.scale.setScalar(1); sc.add(root);
  root.traverse(o => { if (o.isMesh && o.material.userData.side != null) o.material.side = o.material.userData.side });
  mix = new THREE.AnimationMixer(root); R = { root, act: {} };
  const ui = document.getElementById('ui');
  for (const c of A.an.animations) {
    R.act[c.name] = mix.clipAction(c);
    const b = document.createElement('button'); b.textContent = NOMES[c.name] || c.name; b.onclick = () => tocar(c.name, b); ui.append(b);
    if (c.name === 'Idle_A') tocar(c.name, b);
  }
  document.getElementById('msg').textContent = 'arraste pra girar';
}, undefined, e => document.getElementById('msg').textContent = 'erro: abra por um servidor (veja o README)');
function tocar(n, b) {
  const a = R.act[n], prev = atual && R.act[atual]; a.reset().play(); if (prev && prev !== a) a.crossFadeFrom(prev, 0.2, false); atual = n;
  document.querySelectorAll('#ui button').forEach(x => x.classList.toggle('on', x === b));
}
const relogio = new THREE.Clock();
r.setAnimationLoop(() => {
  const dt = Math.min(0.05, relogio.getDelta());
  if (mix) { mix.update(dt); R.root.updateMatrixWorld(true); VRMC.tick(R, dt) }
  cam.position.set(Math.sin(ang) * dist, alt + 0.3, Math.cos(ang) * dist); cam.lookAt(0, 1.0, 0); r.render(sc, cam);
});
</script></body></html>
