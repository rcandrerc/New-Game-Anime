<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Game Anime — personagens</title>
<style>
  :root{--bg:#1b2030;--fg:#eceef4;--dim:#9aa3b8;--btn:#2a3145;--line:#465170;--accent:#e8a33a;--ink:#16130e;color-scheme:dark}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:8px 11px;white-space:nowrap}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  #top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));
    background:linear-gradient(var(--bg) 65%,transparent)}
  #chars{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #chars::-webkit-scrollbar{display:none}
  #info{margin-top:6px;color:var(--dim);font-size:12px}
  #anims{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    padding:18px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
    background:linear-gradient(transparent,var(--bg) 30%)}
  #anims button{padding:7px 10px;font-size:13px}
</style></head>
<body>
<div id="top"><div id="chars"></div><div id="info">carregando…</div></div>
<div id="anims"></div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/vrm_char.js"></script>
<script>
// Página de teste dos personagens do New Game Anime: escolha o personagem em cima e a animação embaixo.
// Arraste pra girar a câmera; pinça ou rodinha pra aproximar. A física de cabelo/roupa roda em todos (js/vrm_char.js).
const PERS = [
  ['sendagaya_shino', 'Hana', 'CC0'], ['sendagaya_shibu', 'Rin', 'CC0'], ['darkness_shibu', 'Yami', 'CC0'],
  ['sakurada_fumiriya', 'Ren', 'CC0'], ['victoria_rubin', 'Rubi', 'CC0'], ['vita', 'Mika', 'CC0'], ['vivi', 'Luna', 'CC0'],
  ['hairsample_female', 'Amostra de cabelo (moça)', 'CC0'], ['hairsample_male', 'Amostra de cabelo (rapaz)', 'CC0'],
];
const NOMES = { Idle_A: 'Parada', Walking_A: 'Andar', Running_A: 'Correr', Jump_Idle: 'No ar', Fall_Idle: 'Queda',
  Jump_Full_Short: 'Cambalhota', Dodge_Forward: 'Dash', Melee_1H_Attack_Slice_Diagonal: 'Ataque', Melee_2H_Attack_Spin: 'Giro',
  Melee_Block: 'Defesa', Ranged_Magic_Shoot: 'Magia', Ranged_Magic_Spellcasting: 'Conjurar', Ranged_Magic_Spellcasting_Long: 'Conjurar longo',
  Ranged_Magic_Summon: 'Invocar', Ranged_Magic_Raise: 'Curar', Interact: 'Interagir', PickUp: 'Pegar', Chopping: 'Machado', Pickaxing: 'Picareta',
  Sit_Floor_Idle: 'Sentar no chão', Sit_Chair_Idle: 'Sentar na cadeira', Hit_A: 'Dano', Death_A: 'Morte',
  Jump_Start: 'Impulso do pulo', Jump_Run: 'Pulo correndo', Land_A: 'Aterrissar', Land_B: 'Aterrissar forte', Flip_Front: 'Mortal frente', Flip_Back: 'Mortal trás',
  Roll_Quick: 'Rolamento', Roll_Dive: 'Mergulho', Roll_Sprint: 'Arrancada' };
const ORDEM = Object.keys(NOMES);

const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1b2030);
sc.add(new THREE.HemisphereLight(0xfff4e8, 0x40485a, 1.1)); const sol = new THREE.DirectionalLight(0xffffff, 0.9); sol.position.set(2, 4, 3); sc.add(sol);
const chao = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshStandardMaterial({ color: 0x262d3c })); chao.rotation.x = -Math.PI / 2; sc.add(chao);
const cam = new THREE.PerspectiveCamera(35, 1, 0.05, 50); let ang = 0.5, dist = 5;
function tam() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() } addEventListener('resize', tam); tam();
// girar com um dedo, aproximar com dois (ou rodinha)
const toques = new Map(); let pin = 0;
r.domElement.addEventListener('pointerdown', e => { toques.set(e.pointerId, e.clientX + ',' + e.clientY); r.domElement.setPointerCapture(e.pointerId) });
r.domElement.addEventListener('pointermove', e => {
  if (!toques.has(e.pointerId)) return; const [x0] = toques.get(e.pointerId).split(',').map(Number);
  toques.set(e.pointerId, e.clientX + ',' + e.clientY);
  if (toques.size === 1) ang -= (e.clientX - x0) * 0.01;
  else { const p = [...toques.values()].map(v => v.split(',').map(Number)), d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); if (pin) dist = Math.min(8, Math.max(1.6, dist * pin / d)); pin = d }
});
const solta = e => { toques.delete(e.pointerId); pin = 0 }; r.domElement.addEventListener('pointerup', solta); r.domElement.addEventListener('pointercancel', solta);
addEventListener('wheel', e => dist = Math.min(8, Math.max(1.6, dist + e.deltaY * 0.003)));

const info = document.getElementById('info'), boxC = document.getElementById('chars'), boxA = document.getElementById('anims');
let mix = null, R = null, atual = 'Idle_A', pedido = 0;
const cache = {};
function carregar(i) {
  const [arq, nome, lic] = PERS[i], meu = ++pedido;
  [...boxC.children].forEach((b, k) => b.classList.toggle('on', k === i));
  info.textContent = 'carregando ' + nome + '…';
  (cache[arq] || (cache[arq] = new Promise((ok, erro) => new THREE.GLTFLoader().load('personagens/' + arq + '.glb', ok, undefined, erro)))).then(gl => {
    if (meu !== pedido) return;
    if (R) { sc.remove(R.root); mix.stopAllAction() }
    if (!gl.__A) gl.__A = VRMC.prep(gl);
    const A = gl.__A, root = A.gl.scene; sc.add(root); root.userData.vrm.J = null;
    root.traverse(o => { if (o.isMesh && o.material.userData.side != null) o.material.side = o.material.userData.side });
    mix = new THREE.AnimationMixer(root); R = { root, act: {} };
    for (const c of A.an.animations) R.act[c.name] = mix.clipAction(c);
    montarBotoes(A.an.animations.map(c => c.name)); tocar(R.act[atual] ? atual : 'Idle_A');
    info.textContent = nome + ' · ' + lic + ' · arraste pra girar';
  }).catch(() => { if (meu === pedido) info.textContent = 'Não consegui carregar ' + nome + '. Toque de novo pra tentar.'; delete cache[arq] });
  try { localStorage.setItem('nga-pers', i) } catch (e) {}
}
function montarBotoes(nomes) {
  boxA.textContent = '';
  for (const n of ORDEM.filter(n => nomes.includes(n))) { const b = document.createElement('button'); b.textContent = NOMES[n]; b.dataset.n = n; b.onclick = () => tocar(n); boxA.append(b) }
}
function tocar(n) {
  const a = R.act[n], prev = R.act[atual]; a.reset().play(); if (prev && prev !== a) a.crossFadeFrom(prev, 0.2, false); atual = n;
  [...boxA.children].forEach(b => b.classList.toggle('on', b.dataset.n === n));
}
PERS.forEach(([, nome], i) => { const b = document.createElement('button'); b.textContent = nome; b.onclick = () => carregar(i); boxC.append(b) });
let ini = 0; try { ini = Math.min(PERS.length - 1, +localStorage.getItem('nga-pers') || 0) } catch (e) {}
carregar(ini); boxC.children[ini].scrollIntoView({ inline: 'center' });

const relogio = new THREE.Clock();
r.setAnimationLoop(() => {
  const dt = Math.min(0.05, relogio.getDelta());
  if (mix) { mix.update(dt); R.root.updateMatrixWorld(true); VRMC.tick(R, dt) }
  cam.position.set(Math.sin(ang) * dist, 1.15, Math.cos(ang) * dist); cam.lookAt(0, 0.68, 0); r.render(sc, cam);
});
</script></body></html>
