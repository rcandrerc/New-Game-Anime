<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141a28">
<title>New Game Anime — hábitos</title>
<style>
  :root{--bg:#141a28;--fg:#f4f6fb;--fg2:#b9c2d6;--glass:rgba(20,26,40,.6);--card:#1e2638;--card2:#263049;--line:rgba(255,255,255,.14);--accent:#f0a83a;--ink:#16130e;
    --hp:#ff5a4a;--xp:#ffd23a;--bom:#5fd18a;--ruim:#ff6b5a;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  /* ---------- arena (metade de cima) ---------- */
  #arena{position:relative;flex:0 0 46%;min-height:280px;overflow:hidden;background:#9fc7e8;touch-action:none}
  #arena canvas{display:block;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  #hud .esq{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;filter:drop-shadow(0 1px 2px #0009)}
  #hud .nome{font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
  #hud .nome small{font-weight:600;opacity:.9;margin-left:6px}
  .bar{position:relative;height:15px;border-radius:8px;background:rgba(10,12,20,.65);border:1px solid rgba(255,255,255,.35);overflow:hidden;max-width:230px}
  .bar i{position:absolute;inset:0;transform-origin:left;transition:transform .25s}
  #hpB i{background:linear-gradient(90deg,#c9302c,#ff6b5a)} #xpB i{background:linear-gradient(90deg,#d9a21b,#ffe066)}
  .bar span{position:absolute;inset:0;font:700 10.5px/15px system-ui,sans-serif;padding-left:7px;text-shadow:0 1px 1px #000;white-space:nowrap}
  #hud .dir{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  #hud .chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;backdrop-filter:blur(4px)}
  #bModo{font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(4px)}
  #bModo.manual{background:#8a3cc8;border-color:#b87af0}
  #bPocao{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--glass)}
  #bPocao[hidden]{display:none}
  #ctl{position:absolute;inset:0;pointer-events:none;display:none}
  body.manual #ctl{display:block}
  #stick{position:absolute;left:18px;bottom:18px;width:110px;height:110px;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
  #knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8)}
  #ctl .ac{position:absolute;pointer-events:auto;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:800;font-size:12.5px;backdrop-filter:blur(4px)}
  #bAtk{right:18px;bottom:20px;width:76px;height:76px;background:rgba(150,40,40,.7)}
  #bMag{right:104px;bottom:14px;width:56px;height:56px;background:rgba(60,40,140,.7)}
  #bMag[data-cd]::after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:16px}
  #faixa{position:absolute;left:0;right:0;top:24%;text-align:center;font:900 30px system-ui,sans-serif;color:#ffe066;text-shadow:0 3px 0 #a5560f,0 0 14px #000a;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;transform:scale(.8)}
  #faixa.on{opacity:1;transform:scale(1)}
  #faixa small{display:block;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;margin-top:4px}
  #nums div{position:absolute;left:0;top:0;font:800 18px system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #b2321f,0 0 6px #000a;pointer-events:none;white-space:nowrap;will-change:transform}
  #nums div.crit{color:#ffd23a;font-size:24px}
  #nums div.xp{color:#ffe066;text-shadow:0 2px 0 #8a5a00,0 0 6px #000a;font-size:17px}
  #nums div.ouro{color:#ffd86b;text-shadow:0 2px 0 #6b4a00,0 0 6px #000a;font-size:15px}
  #nums div.dor{color:#ff8a7a;text-shadow:0 2px 0 #5a0000,0 0 6px #000a}
  #nums div.cura{color:#8dffb0;text-shadow:0 2px 0 #0a5a2a,0 0 6px #000a}
  #barras div{position:absolute;left:0;top:0;width:54px;height:6px;margin-left:-27px;border-radius:3px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);overflow:hidden;pointer-events:none}
  #barras div i{display:block;height:100%;background:#ff5a4a;transform-origin:left}
  #barras div.chefe{width:80px;margin-left:-40px;height:8px} #barras div.chefe i{background:#c86bff}
  #dor{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 24px rgba(220,30,20,.55);opacity:0;transition:opacity .35s}
  #carga{position:absolute;inset:0;display:grid;place-content:center;gap:10px;justify-items:center;background:rgba(10,14,24,.6);font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;z-index:5}
  #carga.fora{display:none} #carga .bar{width:200px} #carga .bar i{background:var(--accent);transform:scaleX(0)}
  /* ---------- painel de tarefas (metade de baixo) ---------- */
  #painel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line)}
  #abas{display:flex;gap:4px;padding:6px 6px 0}
  #abas button{flex:1;padding:9px 2px;font-size:13.5px;font-weight:700;border-radius:10px 10px 0 0;border-bottom:none;background:var(--card);color:var(--fg2)}
  #abas button.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
  #abas button b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px}
  #lista{flex:1;overflow-y:auto;padding:8px 8px 4px;background:var(--card2);-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .vazio{opacity:.7;text-align:center;padding:24px 10px;font-size:14px;line-height:1.4}
  .item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:6px;transition:opacity .4s,transform .4s}
  .item.some{opacity:0;transform:translateX(40px)}
  .item .txt{flex:1;min-width:0;padding:6px 2px;line-height:1.25}
  .item .txt small{display:block;color:var(--fg2);font-size:12px;margin-top:2px}
  .item .chk{width:40px;height:40px;flex:none;border-radius:10px;padding:0;font-size:20px;font-weight:900;display:grid;place-items:center;background:#2f3a55;border:2px solid #4b5878}
  .item.feito .chk{background:var(--bom);border-color:var(--bom);color:#0b2416}
  .item.feito .txt{opacity:.55;text-decoration:line-through}
  .item .mais{background:#1f6b45;border-color:#2f9a64} .item .menos{background:#7a2a2a;border-color:#b04444}
  .item .x{width:30px;height:30px;padding:0;flex:none;border-radius:8px;background:none;border:none;color:var(--fg2);font-size:15px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;background:#39445f;color:#d7def0}
  .tag.f{background:#2e5a44} .tag.m{background:#5a4a24} .tag.d{background:#6a2f3a}
  #novo{display:flex;gap:6px;padding:8px;background:var(--card2);border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #novo input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;user-select:text;-webkit-user-select:text}
  #novo select{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 4px}
  #novo .tipo{padding:0 10px;font-weight:900;font-size:17px}
  #novo .tipo.off{opacity:.35}
  #novo #nAdd{font-weight:800;background:var(--accent);color:var(--ink);border-color:var(--accent);padding:0 14px;font-size:20px}
  #novo[hidden]{display:none}
  /* aba Heroína */
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .sec h3{margin:0 0 8px;font-size:14px;color:#ffe7a8}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
  .stats span{color:var(--fg2)} .stats b{float:right}
  .loja{display:flex;flex-direction:column;gap:6px}
  .loja button{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
  .loja button small{display:block;color:var(--fg2);font-size:12px}
  .loja button:disabled{opacity:.45}
  .loja .preco{font-weight:800;color:#ffd86b;white-space:nowrap}
  #pers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #pers button{padding:0;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#2f3a55}
  #pers button img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:linear-gradient(#3a4a6a,#24304a)}
  #pers button span{font-size:10.5px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pers button.on{outline:3px solid var(--accent);outline-offset:-2px}
  .dica{font-size:12.5px;color:var(--fg2);line-height:1.4;margin:0}
  #aviso{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);max-width:calc(100vw - 30px);background:#0d111c;border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 24px #000a;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:20;text-align:center}
  #aviso.on{opacity:1;transform:translateX(-50%)}
</style></head>
<body>
<div id="arena">
  <div id="hud">
    <div class="esq">
      <div class="nome" id="hNome">Shino<small id="hNv">Nível 1</small></div>
      <div class="bar" id="hpB"><i></i><span>Vida 100/100</span></div>
      <div class="bar" id="xpB"><i></i><span>XP 0/40</span></div>
    </div>
    <div class="dir">
      <button id="bModo" aria-label="Trocar entre automático e manual">▶ Auto</button>
      <div class="chip" id="hOuro">🪙 0</div>
      <div class="chip" id="hOnda">Onda 1</div>
      <button id="bPocao" hidden>🧪 0</button>
    </div>
  </div>
  <div id="ctl"><div id="stick"><div id="knob"></div></div><button class="ac" id="bMag">Magia</button><button class="ac" id="bAtk">Atacar</button></div>
  <div id="barras"></div><div id="nums"></div><div id="dor"></div>
  <div id="faixa"></div>
  <div id="carga"><b>Carregando…</b><div class="bar"><i></i></div></div>
</div>
<div id="painel">
  <div id="abas">
    <button data-aba="hab">Hábitos</button><button data-aba="diar">Diárias</button><button data-aba="afz">Afazeres</button><button data-aba="her">Heroína</button>
  </div>
  <div id="lista"></div>
  <div id="novo">
    <input id="nTxt" placeholder="Nova tarefa…" maxlength="80" enterkeyhint="done">
    <button class="tipo" id="nPos" aria-label="Hábito bom (+)">+</button><button class="tipo" id="nNeg" aria-label="Hábito ruim (−)">−</button>
    <select id="nDif" aria-label="Dificuldade"><option value="f">Fácil</option><option value="m" selected>Médio</option><option value="d">Difícil</option></select>
    <button id="nAdd" aria-label="Adicionar">+</button>
  </div>
</div>
<div id="aviso"></div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/vrm_char.js"></script>
<script>
// Esboço do jogo de hábitos (estilo Habitica) com os personagens do New Game Anime, pro celular em pé.
// Em cima: a arena, onde a heroína luta sozinha (Auto) ou com joystick (Manual).
// Embaixo: hábitos, diárias e afazeres. Só as tarefas dão XP e sobem o nível; os monstros dão ouro, que compra poção e equipamento.
const PERS = [ // arquivo, nome
  ['sendagaya_shino', 'Shino'], ['sendagaya_shibu', 'Shibu'], ['darkness_shibu', 'Darkness Shibu'], ['sakurada_fumiriya', 'Fumiriya'],
  ['victoria_rubin', 'Victoria Rubin'], ['vita', 'Vita'], ['vivi', 'Vivi'], ['hairsample_female', 'Moça (moletom)'], ['hairsample_male', 'Rapaz (moletom)'],
  ['avatarsample_a', 'Avatar A'], ['avatarsample_b', 'Avatar B'], ['avatarsample_c', 'Avatar C'],
];
// recompensa por dificuldade: XP, ouro e vida perdida (hábito ruim ou diária esquecida)
const DIF = { f: { n: 'Fácil', xp: 10, ouro: 3, dor: 6 }, m: { n: 'Médio', xp: 20, ouro: 6, dor: 12 }, d: { n: 'Difícil', xp: 35, ouro: 10, dor: 20 } };
const AFZ_X = 1.5; // afazer (tarefa única) vale 50% a mais
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
const uid = () => Math.random().toString(36).slice(2, 9);
const hpMax = () => 100 + 10 * (S.nv - 1);
const xpProx = () => 40 + 20 * (S.nv - 1);
const ataque = () => 10 + 3 * (S.nv - 1) + 4 * S.espada;
const defesa = () => Math.min(0.6, 0.07 * S.armad); // fração do dano dos monstros que a armadura segura

// ---------------- estado salvo no aparelho ----------------
const CHAVE = 'nga-habitos-v1';
function padrao() {
  const t = (txt, d, x) => Object.assign({ id: uid(), t: txt, d }, x);
  return { pers: 0, nv: 1, xp: 0, hp: 100, ouro: 0, espada: 0, armad: 0, pocoes: 1, onda: 1, recorde: 1, auto: true, aba: 'diar', dia: hoje(), feitos: 0,
    hab: [t('Beber um copo de água', 'f', { pos: true, neg: false, c: 0, cn: 0 }), t('Fazer exercício', 'm', { pos: true, neg: false, c: 0, cn: 0 }), t('Comer besteira', 'm', { pos: false, neg: true, c: 0, cn: 0 })],
    diar: [t('Arrumar a cama', 'f', { ok: false }), t('Ler 10 páginas', 'm', { ok: false }), t('Estudar 30 minutos', 'd', { ok: false })],
    afz: [t('Organizar a mesa', 'm', {}), t('Marcar o dentista', 'f', {})] };
}
let S; try { S = Object.assign(padrao(), JSON.parse(localStorage.getItem(CHAVE) || 'null') || {}) } catch (e) { S = padrao() }
function salva() { try { localStorage.setItem(CHAVE, JSON.stringify(S)) } catch (e) {} }

// ---------------- cena ----------------
const arena = document.getElementById('arena');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(1.5, devicePixelRatio)); r.outputEncoding = THREE.sRGBEncoding;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; arena.prepend(r.domElement);
r.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); let ja = false; try { ja = sessionStorage.getItem('nga-hrec') === '1'; sessionStorage.setItem('nga-hrec', '1') } catch (x) {} if (!ja) setTimeout(() => location.reload(), 600) });
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xf2c597); sc.fog = new THREE.Fog(0xe6b88e, 14, 34);
const hemi = new THREE.HemisphereLight(0xffe2c0, 0x3d5a2a, 0.72); sc.add(hemi);
const sol = new THREE.DirectionalLight(0xffc48a, 0.95); sol.castShadow = true; sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); sol.shadow.bias = -0.0005; sc.add(sol, sol.target);
const cam = new THREE.PerspectiveCamera(48, 1, 0.05, 80);
function tam() { const w = arena.clientWidth, h = arena.clientHeight; r.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix() }
addEventListener('resize', tam); tam();
const M = c => new THREE.MeshLambertMaterial({ color: new THREE.Color(c).convertSRGBToLinear() });
{ const chao = new THREE.Mesh(new THREE.CircleGeometry(40, 48), M(0x6a9446)); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; sc.add(chao);
  const clareira = new THREE.Mesh(new THREE.CircleGeometry(8.5, 40), M(0x7aa452)); clareira.rotation.x = -Math.PI / 2; clareira.position.y = 0.005; clareira.receiveShadow = true; sc.add(clareira) }
const RAIO = 8; // a arena: a heroína e os monstros ficam dentro desse círculo
const _gl = new THREE.GLTFLoader(), _mA = new THREE.Matrix4(), _vA = new THREE.Vector3(), _qA = new THREE.Quaternion(), _sA = new THREE.Vector3(), _Y = new THREE.Vector3(0, 1, 0);
function espalha(nome, lista, sombra) { // várias cópias de um modelo do cenário numa malha instanciada; lista de [x, z, giro, escala]
  _gl.load('cenario/' + nome + '.glb', g => {
    g.scene.updateMatrixWorld(true); g.scene.traverse(m => {
      if (!m.isMesh) return; m.material.normalMap = null;
      const im = new THREE.InstancedMesh(m.geometry, m.material, lista.length);
      lista.forEach(([x, z, rot, s], i) => { _mA.compose(_vA.set(x, 0, z), _qA.setFromAxisAngle(_Y, rot), _sA.set(s, s, s)).multiply(m.matrixWorld); im.setMatrixAt(i, _mA) });
      im.castShadow = sombra; im.receiveShadow = true; sc.add(im);
    });
  });
}
function cenario() { // anel de árvores em volta da clareira, umas pedras e mato
  let sd = 11; const rd = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646 }, ru = (a, b) => a + rd() * (b - a);
  const arv = { Pine_1: [], Pine_2: [], CommonTree_1: [], CommonTree_2: [], CommonTree_3: [] }, nomes = Object.keys(arv);
  for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2 + ru(-0.1, 0.1), rr = ru(10.5, 13.5); arv[nomes[i % nomes.length]].push([Math.cos(a) * rr, Math.sin(a) * rr, ru(0, 6.28), ru(0.5, 0.68)]) }
  for (const n in arv) espalha(n, arv[n], true);
  const pedras = [], mato = [], flores = [];
  for (let i = 0; i < 6; i++) { const a = ru(0, 6.28), rr = ru(9, 10.5); pedras.push([Math.cos(a) * rr, Math.sin(a) * rr, ru(0, 6.28), ru(0.5, 0.9)]) }
  for (let i = 0; i < 22; i++) { const a = ru(0, 6.28), rr = ru(6.5, 10.5); mato.push([Math.cos(a) * rr, Math.sin(a) * rr, ru(0, 6.28), ru(0.3, 0.45)]) }
  for (let i = 0; i < 12; i++) { const a = ru(0, 6.28), rr = ru(4, 9); flores.push([Math.cos(a) * rr, Math.sin(a) * rr, ru(0, 6.28), ru(0.25, 0.35)]) }
  espalha('Rock_Medium_1', pedras, true); espalha('Grass_Common_Tall', mato, false); espalha('Flower_3_Group', flores, false);
}

// ---------------- sons (Kenney, CC0) ----------------
const SOM = { ctx: null, buf: {}, vol: null };
const SONS = { acerto: ['acerto1', 'acerto2', 'acerto3'], critico: ['critico1', 'critico2'], queda: ['queda'], metal: ['metal1', 'metal2'], dor: ['dor'],
  lute: ['voz_lute'], venceu: ['voz_venceu'], perfeito: ['voz_perfeito'], fim: ['voz_fim'], vitoria: ['jingle_vitoria'], pulo: ['pulo1', 'pulo2'] };
function somLiga() {
  if (SOM.ctx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  SOM.ctx = new AC(); SOM.vol = SOM.ctx.createGain(); SOM.vol.gain.value = 0.7; SOM.vol.connect(SOM.ctx.destination);
  for (const lista of Object.values(SONS)) for (const n of lista) fetch('sons/' + n + '.ogg').then(x => x.arrayBuffer()).then(a => SOM.ctx.decodeAudioData(a, b => SOM.buf[n] = b)).catch(() => {});
}
addEventListener('pointerup', somLiga, { capture: true });
function som(nome, vol = 1, vel = 1) {
  if (!SOM.ctx) return; const lista = SONS[nome], b = lista && SOM.buf[lista[Math.random() * lista.length | 0]]; if (!b) return;
  const s = SOM.ctx.createBufferSource(), g = SOM.ctx.createGain(); s.buffer = b; s.playbackRate.value = vel * (0.94 + Math.random() * 0.12); g.gain.value = vol;
  s.connect(g); g.connect(SOM.vol); s.start();
}
function plim(nota = 0, vol = 0.25) { // sininho de tarefa feita (sintetizado)

  for (const b of BICHOS) if (b.vivo) { const ex = H.x - b.x, ez = H.z - b.z, e = Math.hypot(ex, ez), m = 0.75 * K / 0.64 * (b.chefe ? 1.3 : 1); if (e < m && e > 1e-4) { H.x += ex / e * (m - e); H.z += ez / e * (m - e) } }
  atkPasso(dt);
  if (!H.atk && !(H.hit > 0) && !H.comem) { if (v > 0.3) tocar(v > RUN * 0.6 ? 'Running_A' : 'Walking_A', 1); else tocar(BICHOS.some(b => b.vivo) && R.act.Sword_Idle ? 'Sword_Idle' : 'Idle_A', 1) }
  if (H.comem > 0) { H.comem -= dt; if (H.comem <= 0) H.comem = 0 }
}

// ---------------- efeitos ----------------
const numsEl = document.getElementById('nums'), NUMS = [], _p = new THREE.Vector3();
function numero(txt, x, y, z, cls) { const el = document.createElement('div'); el.textContent = txt; if (cls) el.className = cls; numsEl.appendChild(el); NUMS.push({ el, x: x + (Math.random() - 0.5) * 0.3, y, z, t: 0 }) }
function numsPasso(dt) {
  const w = arena.clientWidth, h = arena.clientHeight;
  for (let i = NUMS.length - 1; i >= 0; i--) { const n = NUMS[i]; n.t += dt; if (n.t > 1.3) { n.el.remove(); NUMS.splice(i, 1); continue }
    _p.set(n.x, n.y + n.t * 0.9, n.z).project(cam); n.el.style.transform = `translate(${(_p.x + 1) / 2 * w}px,${(1 - _p.y) / 2 * h}px) translate(-50%,-50%) scale(${n.t < 0.12 ? 0.6 + n.t * 3.3 : 1})`; n.el.style.opacity = n.t > 0.9 ? (1.3 - n.t) / 0.4 : 1 }
  for (const b of BICHOS) { if (!b.vivo || b.nasce < 1) { b.bar.style.display = 'none'; continue } b.bar.style.display = '';
    _p.set(b.x, 1.85 * K / 0.64 * (b.chefe ? 1.45 : 1), b.z).project(cam); b.bar.style.transform = `translate(${(_p.x + 1) / 2 * w}px,${(1 - _p.y) / 2 * h}px)`; b.bar.firstChild.style.transform = 'scaleX(' + Math.max(0, b.hp / b.max) + ')' }
}
const FX = [], fxGeo = new THREE.SphereGeometry(0.05, 6, 4);
function faiscas(p, cor, n) { for (let i = 0; i < n; i++) { const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color: cor, transparent: true })); m.position.copy(p); sc.add(m);
  FX.push({ m, vx: (Math.random() - 0.5) * 5, vy: Math.random() * 4, vz: (Math.random() - 0.5) * 5, t: 0, vida: 0.5 + Math.random() * 0.3 }) } }
function brilho(cor) { // anel de luz subindo em volta da heroína (tarefa feita, cura, nível novo)
  const anel = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.04, 6, 32), new THREE.MeshBasicMaterial({ color: cor, transparent: true }));
  anel.rotation.x = Math.PI / 2; anel.position.set(H.x, 0.1, H.z); sc.add(anel); FX.push({ m: anel, anel: true, t: 0, vida: 0.9 });
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color: cor, transparent: true })); m.position.set(H.x + Math.cos(a) * 0.5, 0.2, H.z + Math.sin(a) * 0.5); sc.add(m);
    FX.push({ m, vx: Math.cos(a) * 0.3, vy: 2 + Math.random(), vz: Math.sin(a) * 0.3, t: 0, vida: 0.9 + Math.random() * 0.3, leve: true }) }
}
function fxPasso(dt) {

    if (k >= 1) { sc.remove(f.m); f.m.material.dispose(); if (f.anel) f.m.geometry.dispose(); FX.splice(i, 1); continue }
    if (f.anel) { f.m.position.set(H.x, 0.1 + k * ALT * 1.1, H.z); f.m.scale.setScalar(1 + k * 0.4) }
    else { f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt; if (!f.leve) f.vy -= 9 * dt }
    f.m.material.opacity = 1 - k }
}
const dorEl = document.getElementById('dor'); let dorT = 0; function doi() { dorT = 0.35; dorEl.style.opacity = 1 }
const faixaEl = document.getElementById('faixa'); let faixaT = 0;
function faixa(txt, sub, t = 1.5) { faixaEl.innerHTML = ''; faixaEl.append(txt); if (sub) { const s = document.createElement('small'); s.textContent = sub; faixaEl.append(s) } faixaEl.classList.add('on'); faixaT = t }
const avisoEl = document.getElementById('aviso'); let avisoT = 0;
function aviso(txt, t = 2.6) { avisoEl.textContent = txt; avisoEl.classList.add('on'); clearTimeout(avisoT); avisoT = setTimeout(() => avisoEl.classList.remove('on'), t * 1000) }

// ---------------- recompensas das tarefas (a única fonte de XP) ----------------
function ganha(xp, ouro, cura) {
  S.xp += xp; S.ouro += ouro; if (cura) S.hp = Math.min(hpMax(), S.hp + cura);
  numero('+' + xp + ' XP', H.x, ALT + 0.35, H.z, 'xp'); if (ouro) setTimeout(() => numero('+' + ouro + ' 🪙', H.x, ALT + 0.1, H.z, 'ouro'), 180);
  brilho(0xffe066); plim(0); comemora();
  let subiu = false; while (S.xp >= xpProx()) { S.xp -= xpProx(); S.nv++; subiu = true }
  if (subiu) { S.hp = hpMax(); som('vitoria', 0.8); setTimeout(() => som('perfeito', 0.7), 900); faixa('Nível ' + S.nv + '!', 'mais vida e mais força; vida cheia', 2.2); setTimeout(() => brilho(0xffffff), 250) }
  salva(); hud();
}
function perde(xp, ouro) { // desmarcou uma tarefa: devolve o que tinha ganhado (não desce de nível)

}
function machuca(v, motivo) {
  S.hp = Math.max(0, S.hp - v); numero('-' + v, H.x, ALT + 0.2, H.z, 'dor'); doi(); som('dor', 0.6); if (motivo) aviso(motivo);
  if (S.hp <= 0 && !H.desm) desmaia(); salva(); hud();
}
function comemora() { if (!R || H.atk || H.desm || BICHOS.some(b => b.vivo)) return; H.comem = dur('Ranged_Magic_Raise') * 0.9; tocar('Ranged_Magic_Raise', 1.1, 0.1) }
function viraDia() { // diárias esquecidas tiram vida ao virar o dia; contadores dos hábitos zeram
  if (S.dia === hoje()) return;
  const falt = S.diar.filter(d => !d.ok), dano = falt.reduce((s, d) => s + DIF[d.d].dor, 0);
  for (const d of S.diar) d.ok = false; for (const h of S.hab) { h.c = 0; h.cn = 0 } S.dia = hoje(); salva();
  if (dano) setTimeout(() => machuca(dano, falt.length === 1 ? 'Ontem ficou 1 diária sem fazer: −' + dano + ' de vida.' : 'Ontem ficaram ' + falt.length + ' diárias sem fazer: −' + dano + ' de vida.'), 1500);
  else if (falt.length === 0) setTimeout(() => aviso('Dia novo! As diárias voltaram.'), 1500);
}
viraDia(); setInterval(() => { viraDia(); if (aba === 'diar') lista() }, 60000);

// ---------------- HUD ----------------

  document.querySelector('#xpB i').style.transform = 'scaleX(' + S.xp / xpProx() + ')'; document.querySelector('#xpB span').textContent = 'XP ' + S.xp + '/' + xpProx();
  document.getElementById('hOuro').textContent = '🪙 ' + S.ouro; document.getElementById('hOnda').textContent = (S.onda % 5 === 0 ? 'Chefe · ' : '') + 'Onda ' + S.onda;
  const bm = document.getElementById('bModo'); bm.textContent = S.auto ? '▶ Auto' : '🕹 Manual'; bm.classList.toggle('manual', !S.auto); document.body.classList.toggle('manual', !S.auto);

}

// ---------------- lista de tarefas ----------------
let aba = S.aba || 'diar', novoPos = true, novoNeg = false;
const listaEl = document.getElementById('lista');
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e };
function trocaAba(a) { aba = a; S.aba = a; salva(); for (const b of document.querySelectorAll('#abas button')) b.classList.toggle('on', b.dataset.aba === a); lista() }
for (const b of document.querySelectorAll('#abas button')) b.onclick = () => trocaAba(b.dataset.aba);
function texto(t, sub) { const d = el('div', 'txt'); d.append(t.t); const s = el('small'); const tg = el('span', 'tag ' + t.d, DIF[t.d].n); s.append(tg); if (sub) s.append(sub); d.append(s);

function apaga(lst, t) { const b = el('button', 'x', '✕'); b.setAttribute('aria-label', 'Apagar'); b.onclick = () => { if (confirm('Apagar "' + t.t + '"?')) { lst.splice(lst.indexOf(t), 1); salva(); lista(); hud() } }; return b }

  document.getElementById('nPos').style.display = document.getElementById('nNeg').style.display = aba === 'hab' ? '' : 'none';
  document.getElementById('nTxt').placeholder = aba === 'hab' ? 'Novo hábito…' : aba === 'diar' ? 'Nova diária…' : 'Novo afazer…';

      if (t.neg) { const b = el('button', 'chk menos', '−'); b.setAttribute('aria-label', 'Fiz o hábito ruim'); b.onclick = () => { t.cn = (t.cn || 0) + 1; machuca(DIF[t.d].dor, null); lista() }; it.append(b) }
      it.append(texto(t, (t.c ? ' +' + t.c : '') + (t.cn ? ' −' + t.cn : '') + (t.c || t.cn ? ' hoje' : '')));
      if (t.pos) { const b = el('button', 'chk mais', '+'); b.setAttribute('aria-label', 'Fiz o hábito bom'); b.onclick = () => { t.c = (t.c || 0) + 1; ganha(DIF[t.d].xp, DIF[t.d].ouro); lista() }; it.append(b) }

        setTimeout(() => { it.classList.add('some'); setTimeout(() => { S.afz.splice(S.afz.indexOf(t), 1); salva(); if (aba === 'afz') lista() }, 400) }, 500) };
      it.append(b, texto(t), apaga(S.afz, t)); listaEl.append(it);

}
function heroina() {

  const st = el('div', 'stats'); const lin = (k, v) => { const d = el('div'); d.append(el('span', null, k), el('b', null, v)); st.append(d) };

    b.onclick = () => { if (S.ouro < preco) return; S.ouro -= preco; f(); salva(); hud(); lista(); plim(5) }; lj.append(b) };

}
// adicionar tarefa
const nTxt = document.getElementById('nTxt'), nPos = document.getElementById('nPos'), nNeg = document.getElementById('nNeg');
function tiposHab() { nPos.classList.toggle('off', !novoPos); nNeg.classList.toggle('off', !novoNeg) }
nPos.onclick = () => { novoPos = !novoPos; if (!novoPos && !novoNeg) novoNeg = true; tiposHab() }; nNeg.onclick = () => { novoNeg = !novoNeg; if (!novoPos && !novoNeg) novoPos = true; tiposHab() }; tiposHab();
function adiciona() {
  const t = nTxt.value.trim(); if (!t) { nTxt.focus(); return } const d = document.getElementById('nDif').value, base = { id: uid(), t: t.slice(0, 80), d };
  if (aba === 'hab') S.hab.push(Object.assign(base, { pos: novoPos, neg: novoNeg, c: 0, cn: 0 })); else if (aba === 'diar') S.diar.push(Object.assign(base, { ok: false })); else S.afz.push(base);
  nTxt.value = ''; salva(); lista(); hud(); listaEl.scrollTop = listaEl.scrollHeight;
}
document.getElementById('nAdd').onclick = adiciona; nTxt.addEventListener('keydown', e => { if (e.key === 'Enter') { adiciona(); nTxt.blur() } });

// ---------------- laço ----------------
let t0 = performance.now(), camX = 0, camZ = 0, hudT = 0;
function quadro(t) {
  requestAnimationFrame(quadro); const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
  if (R) { heroiPasso(dt); bichosPasso(dt); orbesPasso(dt); fxPasso(dt);
    player.position.set(H.x, 0, H.z); player.rotation.y = H.face; mix.update(dt); VRMC.tick(R, dt) }
  // câmera atrás e acima da heroína, um pouco de longe pra ver a briga toda

  const D = ALT * 4.3 + (cam.aspect < 0.9 ? 1.2 : 0);
  cam.position.set(camX + Math.sin(yaw) * Math.cos(pitch) * D, ALT * 0.5 + Math.sin(pitch) * D, camZ + Math.cos(yaw) * Math.cos(pitch) * D); cam.lookAt(camX, ALT * 0.45, camZ);
  sol.position.set(camX + 5, 12, camZ + 4); sol.target.position.set(camX, 0, camZ);
  if (dorT > 0) { dorT -= dt; if (dorT <= 0) dorEl.style.opacity = 0 }
  if (faixaT > 0) { faixaT -= dt; if (faixaT <= 0) faixaEl.classList.remove('on') }
  hudT -= dt; if (hudT <= 0) { hudT = 0.25; const mg = document.getElementById('bMag'); if (H.magCd > 0) mg.dataset.cd = Math.ceil(H.magCd); else delete mg.dataset.cd }
  numsPasso(dt); r.render(sc, cam);
}
new ResizeObserver(tam).observe(arena);
trocaAba(aba); hud(); carregar(S.pers); requestAnimationFrame(quadro);
window.HAB = { S, H, BICHOS, ganha, machuca, atacar, magia, sim(n, dt = 1 / 60) { for (let i = 0; i < n; i++) { heroiPasso(dt); bichosPasso(dt); orbesPasso(dt); fxPasso(dt) } } }; // pra testes
</script>
