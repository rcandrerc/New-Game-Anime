<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141a28">
<title>New Game Anime — hábitos</title>
<style>
  :root{--bg:#141a28;--fg:#f4f6fb;--fg2:#b9c2d6;--glass:rgba(20,26,40,.6);--card:#1e2638;--card2:#263049;--line:rgba(255,255,255,.14);--accent:#f0a83a;--ink:#16130e;
    --bom:#5fd18a;--ruim:#ff6b5a;--esp:#ff7a4a;--mag:#7aa8ff;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  /* ---------- mundo (metade de cima) ---------- */
  #arena{position:relative;flex:0 0 48%;min-height:280px;overflow:hidden;background:#f2c597;touch-action:none}
  #arena canvas{display:block;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  #hud .esq{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;filter:drop-shadow(0 1px 2px #0009)}
  #hud .nome{font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
  #hud .nome small{font-weight:600;opacity:.9;margin-left:6px}
  #hud .nome b{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--accent);color:var(--ink);font-size:11px;vertical-align:2px;pointer-events:auto;cursor:pointer;text-shadow:none}
  #hud .nome b[hidden]{display:none}
  .bar{position:relative;height:14px;border-radius:8px;background:rgba(10,12,20,.65);border:1px solid rgba(255,255,255,.35);overflow:hidden;max-width:220px}
  .bar i{position:absolute;inset:0;transform-origin:left;transition:transform .2s}
  #hpB i{background:linear-gradient(90deg,#c9302c,#ff6b5a)} #enB i{background:linear-gradient(90deg,#2d63d6,#5fb2ff)} #xpB i{background:linear-gradient(90deg,#d9a21b,#ffe066)}
  #enB,#xpB{height:12px} #enB span,#xpB span{font-size:9.5px;line-height:12px}
  .bar span{position:absolute;inset:0;font:700 10px/14px system-ui,sans-serif;padding-left:7px;text-shadow:0 1px 1px #000;white-space:nowrap}
  #hud .dir{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  #hud .chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12.5px;backdrop-filter:blur(4px);white-space:nowrap}
  #bModo{font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(4px)}
  #bModo.manual{background:#8a3cc8;border-color:#b87af0}
  #bPocao{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--glass)}
  #bPocao[hidden]{display:none}
  #bMus{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--glass)} #bMus.off{opacity:.55}
  #ctl{position:absolute;inset:0;pointer-events:none;display:none}
  body.manual #ctl{display:block}
  #stick{position:absolute;left:16px;bottom:16px;width:104px;height:104px;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
  #knob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.8)}
  #ctl button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;backdrop-filter:blur(4px)}
  #bAtk{right:14px;bottom:14px;width:72px;height:72px;font-size:13px;background:rgba(150,40,40,.72)}
  #ctl .sk{width:48px;height:48px;font-size:9.5px;background:rgba(110,45,25,.75)}
  #ctl .sk.M{background:rgba(40,50,150,.75)}
  #ctl .sk.sem{opacity:.45}
  #ctl .sk[data-cd]::after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:15px}
  #faixa{position:absolute;left:0;right:0;top:26%;text-align:center;font:900 28px system-ui,sans-serif;color:#ffe066;text-shadow:0 3px 0 #a5560f,0 0 14px #000a;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;transform:scale(.8)}
  #faixa.on{opacity:1;transform:scale(1)}
  #faixa small{display:block;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;margin-top:4px}
  #nums div{position:absolute;left:0;top:0;font:800 18px system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #b2321f,0 0 6px #000a;pointer-events:none;white-space:nowrap;will-change:transform}
  #nums div.crit{color:#ffd23a;font-size:24px}
  #nums div.xp{color:#ffe066;text-shadow:0 2px 0 #8a5a00,0 0 6px #000a;font-size:17px}
  #nums div.ouro{color:#ffd86b;text-shadow:0 2px 0 #6b4a00,0 0 6px #000a;font-size:15px}
  #nums div.dor{color:#ff8a7a;text-shadow:0 2px 0 #5a0000,0 0 6px #000a}
  #nums div.cura{color:#8dffb0;text-shadow:0 2px 0 #0a5a2a,0 0 6px #000a}
  #barras div{position:absolute;left:0;top:0;width:52px;height:6px;margin-left:-26px;border-radius:3px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);overflow:hidden;pointer-events:none}
  #barras div i{display:block;height:100%;background:#ff5a4a;transform-origin:left}
  #barras div.chefe{width:80px;margin-left:-40px;height:8px} #barras div.chefe i{background:#c86bff}
  #dor{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 46px 12px rgba(220,30,20,.45);opacity:0;transition:opacity .35s}
  #bEst{font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:999px;background:linear-gradient(#5b3a8a,#3a2560);border-color:#b98cff;white-space:nowrap}
  #bEst small{font-weight:700;opacity:.85;margin-left:4px}
  #mapa{position:fixed;inset:0;z-index:30;display:none;background:#1a120b}
  #mapa.on{display:block}
  #mapa .rolo{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #mapa .folha{position:relative;width:100%;max-width:560px;margin:0 auto}
  #mapa canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #mapa .topo{position:absolute;left:0;right:0;top:0;padding:10px 14px 18px;background:linear-gradient(#1a120bee,#1a120b00);pointer-events:none;text-align:center}
  #mapa .topo b{display:inline-block;padding:6px 22px;font:700 19px Georgia,'Times New Roman',serif;letter-spacing:.5px;color:#4a2a10;background:linear-gradient(#f3e2b4,#d9bd7f);border:2px solid #8a5a24;border-radius:6px;box-shadow:0 3px 8px #0008}
  #mapa .topo small{display:block;margin-top:5px;font:600 12px Georgia,serif;color:#f0dcae;text-shadow:0 1px 2px #000}
  #mapa .no{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;padding:0;font:700 20px Georgia,serif;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a22 60%,#8a5a10);color:#4a2a00;border:3px solid #fff3c4;box-shadow:0 3px 0 #0006,0 0 0 3px #5a3a1055}
  #mapa .no.feito{background:radial-gradient(circle at 35% 30%,#e0584a,#a8231a 60%,#5a0e08);color:#ffe3a0;border-color:#e8b060}
  #mapa .no.atual{animation:pulsa 1.2s ease-in-out infinite}
  #mapa .no.tranc{background:radial-gradient(circle at 35% 30%,#b8b0a0,#7a7264 65%,#4a443a);color:#efe6d0;border-color:#a89e88;font-size:17px}
  #mapa .no.chefe{width:62px;height:62px;margin:-31px 0 0 -31px;font-size:27px}
  #mapa .no.sel{outline:3px dashed #7a1a10;outline-offset:5px}
  #mapa .rot{position:absolute;transform:translate(-50%,0);margin-top:29px;font:700 12px/1.15 Georgia,serif;color:#3a200c;text-shadow:0 0 3px #f3e2b4,0 0 6px #f3e2b4;text-align:center;white-space:nowrap;pointer-events:none}
  #mapa .rot small{display:block;font-weight:600;color:#7a4a18;font-size:10.5px}
  #mapa .rot small.ok{color:#8a1a10}
  #mapa .info{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:544px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;
    background:linear-gradient(#3a2414f2,#24160cf2);border:2px solid #8a5a24;box-shadow:0 4px 14px #000a}
  #mapa .info div{flex:1;min-width:0;font:700 14.5px/1.2 Georgia,serif;color:#ffe9b8}
  #mapa .info small{display:block;font:600 11.5px/1.25 system-ui,sans-serif;color:#e6d2a8}
  #mapa .jogar{flex:none;padding:10px 15px;border-radius:10px;font:900 15px system-ui,sans-serif;background:linear-gradient(#ffd85a,#e09a1a);color:#3a2000;border:2px solid #fff3c4;box-shadow:0 3px 0 #7a4a00}
  #mapa .repete{flex:none;padding:10px 10px;border-radius:10px;font:800 15px system-ui,sans-serif;background:#3a2a1a;color:#ffe9b8;border:2px solid #6a4a24;opacity:.7}
  #mapa .repete.on{opacity:1;background:#2f6a3a;border-color:#8fe0a0}
  #mapa .tarefas{flex:none;padding:10px 10px;font-size:15px !important;border-radius:10px;font:800 13px system-ui,sans-serif;background:#5a3a1e;color:#ffe9b8;border:2px solid #8a5a24}
  @keyframes pulsa{0%,100%{box-shadow:0 3px 0 #0006,0 0 0 3px #ffe06655}50%{box-shadow:0 3px 0 #0006,0 0 0 9px #ffe06633,0 0 18px #ffe066}}
  #carga{position:absolute;inset:0;display:grid;place-content:center;gap:10px;justify-items:center;background:rgba(10,14,24,.6);font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;z-index:5}
  #carga.fora{display:none} #carga .bar{width:200px} #carga .bar i{background:var(--accent);transform:scaleX(0)}
  /* ---------- painel de tarefas (metade de baixo) ---------- */
  #painel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line)}
  #puxa{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;height:26px;padding:0;border:0;border-radius:0;background:var(--card);color:var(--fg2);font:700 12px system-ui,sans-serif;touch-action:none;width:100%}
  #puxa::before{content:'';width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
  body.cheio #arena{flex:1 1 auto} body.cheio #painel{flex:0 0 auto} body.cheio #painel > :not(#puxa){display:none}
  body.cheio #puxa{height:34px;padding-bottom:env(safe-area-inset-bottom,0px);color:var(--fg)}
  #abas{display:flex;gap:4px;padding:6px 6px 0}
  #abas button{flex:1;padding:9px 2px;font-size:13.5px;font-weight:700;border-radius:10px 10px 0 0;border-bottom:none;background:var(--card);color:var(--fg2)}
  #abas button.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
  #abas button b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px}
  #lista{flex:1;overflow-y:auto;padding:8px 8px 4px;background:var(--card2);-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .vazio{opacity:.7;text-align:center;padding:24px 10px;font-size:14px;line-height:1.4}
  .item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:6px;transition:opacity .4s,transform .4s}
  .item.some{opacity:0;transform:translateX(40px)}
  .item .txt{flex:1;min-width:0;padding:6px 2px;line-height:1.25}
  .item .txt small{display:block;color:var(--fg2);font-size:12px;margin-top:2px}
  .item .chk{width:40px;height:40px;flex:none;border-radius:10px;padding:0;font-size:20px;font-weight:900;display:grid;place-items:center;background:#2f3a55;border:2px solid #4b5878}
  .item.feito .chk{background:var(--bom);border-color:var(--bom);color:#0b2416}
  .item.feito .txt{opacity:.55;text-decoration:line-through}
  .item .mais{background:#1f6b45;border-color:#2f9a64} .item .menos{background:#7a2a2a;border-color:#b04444}
  .item .x{width:30px;height:30px;padding:0;flex:none;border-radius:8px;background:none;border:none;color:var(--fg2);font-size:15px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;background:#39445f;color:#d7def0}
  .tag.f{background:#2e5a44} .tag.m{background:#5a4a24} .tag.d{background:#6a2f3a}
  #novo{display:flex;gap:6px;padding:8px;background:var(--card2);border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #novo input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;user-select:text;-webkit-user-select:text}
  #novo select{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 4px}
  #novo .tipo{padding:0 10px;font-weight:900;font-size:17px}
  #novo .tipo.off{opacity:.35}
  #novo #nAdd{font-weight:800;background:var(--accent);color:var(--ink);border-color:var(--accent);padding:0 14px;font-size:20px}
  #novo[hidden]{display:none}
  /* aba Heroína */
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .sec h3{margin:0 0 8px;font-size:14px;color:#ffe7a8;display:flex;align-items:center;gap:8px}
  .sec h3 .pts{margin-left:auto;font-size:12px;background:var(--accent);color:var(--ink);border-radius:8px;padding:2px 8px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
  .stats span{color:var(--fg2)} .stats b{float:right}
  .atr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
  .atr .nm{flex:1;min-width:0} .atr .nm b{display:block;font-size:14px} .atr .nm small{display:block;color:var(--fg2);font-size:11.5px;line-height:1.3}
  .atr .v{font-weight:900;font-size:18px;min-width:28px;text-align:center}
  .atr button{width:38px;height:38px;padding:0;font-size:20px;font-weight:900;border-radius:10px;background:#2f9a64;border-color:#4fc488}
  .atr button:disabled{opacity:.25}
  .skills{display:flex;flex-direction:column;gap:6px}
  .sk1{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;background:#2a3350;border-left:4px solid var(--esp)}
  .sk1.M{border-left-color:var(--mag)} .sk1.off{opacity:.5}
  .sk1 div{flex:1;min-width:0} .sk1 b{font-size:13.5px} .sk1 small{display:block;color:var(--fg2);font-size:11.5px}
  .sk1 .req{font-size:11px;font-weight:700;white-space:nowrap;color:var(--fg2)}
  .sk1 .req.ok{color:var(--bom)}
  .loja{display:flex;flex-direction:column;gap:6px}
  .loja button{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
  .loja button small{display:block;color:var(--fg2);font-size:12px}
  .loja button:disabled{opacity:.45}
  .loja .preco{font-weight:800;color:#ffd86b;white-space:nowrap}
  #pers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #pers button{padding:0;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#2f3a55}
  #pers button img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:linear-gradient(#3a4a6a,#24304a)}
  #pers button span{font-size:10.5px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pers button.on{outline:3px solid var(--accent);outline-offset:-2px}
  .dica{font-size:12.5px;color:var(--fg2);line-height:1.4;margin:0}
  #aviso{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);max-width:calc(100vw - 30px);background:#0d111c;border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 24px #000a;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:40;text-align:center}
  #aviso.on{opacity:1;transform:translateX(-50%)}
</style></head>
<body>
<div id="arena">
  <div id="hud">
    <div class="esq">
      <div class="nome" id="hNome">Shino<small id="hNv">Nível 1</small><b id="hPts" hidden></b></div>
      <div class="bar" id="hpB"><i></i><span>Vida 100/100</span></div>
      <div class="bar" id="enB"><i></i><span>Energia 40/40</span></div>
      <div class="bar" id="xpB"><i></i><span>XP 0/40</span></div>
    </div>
    <div class="dir">
      <button id="bModo" aria-label="Trocar entre automático e manual">▶ Auto</button>
      <div class="chip" id="hOuro">🪙 0</div>
      <button id="bEst" aria-label="Abrir o mapa de estágios">⚔ Estágio 1<small>0/5</small></button>
      <button id="bPocao" hidden>🧪 0</button>
    </div>
  </div>
  <div id="ctl"><div id="stick"><div id="knob"></div></div><button id="bAtk">Atacar</button></div>
  <div id="barras"></div><div id="nums"></div><div id="dor"></div>
  <div id="faixa"></div>
  <div id="carga"><b>Carregando…</b><div class="bar"><i></i></div></div>
</div>
<div id="painel">
  <button id="puxa" aria-label="Esconder ou mostrar as tarefas"></button>
  <div id="abas">
    <button data-aba="hab">Hábitos</button><button data-aba="diar">Diárias</button><button data-aba="afz">Afazeres</button><button data-aba="her">Heroína</button>
  </div>
  <div id="lista"></div>
  <div id="novo">
    <input id="nTxt" placeholder="Nova tarefa…" maxlength="80" enterkeyhint="done">
    <button class="tipo" id="nPos" aria-label="Hábito bom (+)">+</button><button class="tipo" id="nNeg" aria-label="Hábito ruim (−)">−</button>
    <select id="nDif" aria-label="Dificuldade"><option value="f">Fácil</option><option value="m" selected>Médio</option><option value="d">Difícil</option></select>
    <button id="nAdd" aria-label="Adicionar">+</button>
  </div>
</div>
<div id="aviso"></div>
<div id="mapa"><div class="rolo"><div class="folha"><canvas aria-hidden="true"></canvas></div></div><div class="topo"><b>Mapa da Missão</b><small></small></div>
  <div class="info"><div></div><button class="tarefas" aria-label="Ver as tarefas">📋</button><button class="repete" aria-pressed="false" aria-label="Repetir o mesmo estágio depois de vencer">🔁</button><button class="jogar">▶ Jogar</button></div></div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/vrm_char.js"></script>
<script>
// Jogo de hábitos (estilo Habitica) com os personagens do New Game Anime, pro celular em pé.
// Em cima: a heroína segue uma trilha num vale e luta com os monstros que encontra, sozinha (Auto) ou com joystick (Manual).
// Embaixo: hábitos, diárias e afazeres. Só as tarefas dão XP; cada nível dá pontos pra distribuir nos atributos,
// e os atributos liberam as skills de espada (Força) e de magia (Magia). Sem classe: dá pra focar num lado ou fazer híbrido.
const PERS = [ // arquivo, nome
  ['sendagaya_shino', 'Shino'], ['sendagaya_shibu', 'Shibu'], ['darkness_shibu', 'Darkness Shibu'], ['sakurada_fumiriya', 'Fumiriya'],
  ['victoria_rubin', 'Victoria Rubin'], ['vita', 'Vita'], ['vivi', 'Vivi'], ['hairsample_female', 'Moça (moletom)'], ['hairsample_male', 'Rapaz (moletom)'],
  ['avatarsample_a', 'Avatar A'], ['avatarsample_b', 'Avatar B'], ['avatarsample_c', 'Avatar C'],
];
// recompensa por dificuldade: XP, ouro e vida perdida (hábito ruim ou diária esquecida)
const DIF = { f: { n: 'Fácil', xp: 10, ouro: 3, dor: 6 }, m: { n: 'Médio', xp: 20, ouro: 6, dor: 12 }, d: { n: 'Difícil', xp: 35, ouro: 10, dor: 20 } };
