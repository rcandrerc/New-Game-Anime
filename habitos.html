<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141a28">
<link rel="manifest" href="habitos.webmanifest"><link rel="apple-touch-icon" href="icones/habitos-192.png"><link rel="icon" href="icones/habitos-192.png">
<title>New Game Anime — hábitos</title>
<style>
  :root{--bg:#141a28;--fg:#f4f6fb;--fg2:#b9c2d6;--glass:rgba(20,26,40,.6);--card:#1e2638;--card2:#263049;--line:rgba(255,255,255,.14);--accent:#f0a83a;--ink:#16130e;
    --bom:#5fd18a;--ruim:#ff6b5a;--esp:#ff7a4a;--mag:#7aa8ff;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  /* ---------- mundo (metade de cima) ---------- */
  #arena{position:relative;flex:0 0 48%;min-height:280px;overflow:hidden;background:#f2c597;touch-action:none}
  #arena>canvas{display:block;touch-action:none} /* só o do jogo: o papel do mapa também é um canvas e precisa deixar deslizar */
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  #hud .esq{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;filter:drop-shadow(0 1px 2px #0009)}
  #hud .nome{font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
  #hud .nome small{font-weight:600;opacity:.9;margin-left:6px}
  #hud .nome b{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--accent);color:var(--ink);font-size:11px;vertical-align:2px;pointer-events:auto;cursor:pointer;text-shadow:none}
  #hud .nome b[hidden]{display:none}
  .bar{position:relative;height:14px;border-radius:8px;background:rgba(10,12,20,.65);border:1px solid rgba(255,255,255,.35);overflow:hidden;max-width:220px}
  .bar i{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:left;transition:transform .2s}
  #hpB i{background:linear-gradient(90deg,#c9302c,#ff6b5a)} #enB i{background:linear-gradient(90deg,#2d63d6,#5fb2ff)} #xpB i{background:linear-gradient(90deg,#d9a21b,#ffe066)}
  #enB,#xpB{height:12px} #enB span,#xpB span{font-size:9.5px;line-height:12px}
  .bar span{position:absolute;top:0;right:0;bottom:0;left:0;font:700 10px/14px system-ui,sans-serif;padding-left:7px;text-shadow:0 1px 1px #000;white-space:nowrap}
  #hud .dir{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  #hud .chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12.5px;backdrop-filter:blur(4px);white-space:nowrap}
  #bCheia{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(4px)} #bCheia svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #bSair{font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:#5a2a24cc;color:#ffd0c8;border:1px solid #c0645a}
  #bModo{font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(4px)}
  #bModo.manual{background:#8a3cc8;border-color:#b87af0}
  #bPocao{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--glass)}
  #bPocao[hidden]{display:none}
  #bMus{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--glass)} #bMus.off{opacity:.55}
  #ctl{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;display:none}
  body.manual #ctl{display:block}
  body.lobby #ctl,body.lobby #bModo{display:none!important} /* acampamento limpo: só a heroína e o Mapa */
  body.lobby:not(.hojeOn):not(.soPainel) #bEst{animation:pulsa 1.6s ease-in-out infinite} /* escondido não pulsa (gastava CPU no Hoje) */
  #stick{position:absolute;left:16px;bottom:16px;width:104px;height:104px;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
  #knob{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.8)}
  #ctl button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:800;line-height:1.05;text-align:center;backdrop-filter:blur(4px)}
  #bAtk{right:14px;bottom:14px;width:72px;height:72px;background:radial-gradient(circle at 50% 35%,#e0523c,#7a1a14 75%);border:2px solid rgba(255,220,200,.75);box-shadow:0 3px 10px #0008,inset 0 2px 6px #fff4}
  #ctl .sk{width:48px;height:48px;background:radial-gradient(circle at 50% 35%,#d0742e,#5e2a0c 75%);border:2px solid rgba(255,225,190,.7);box-shadow:0 2px 8px #0008,inset 0 2px 5px #fff3}
  #ctl .sk.M{background:radial-gradient(circle at 50% 35%,#5a74e8,#1a2370 75%);border-color:rgba(200,215,255,.75)}
  #ctl .sk.R{background:radial-gradient(circle at 50% 35%,#36c49a,#0c5040 75%);border-color:rgba(190,255,230,.75)}
  #ctl button svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px #000c);pointer-events:none}
  #bAtk svg{width:56%;height:56%}
  #bPulo,#bDash{background:radial-gradient(circle at 50% 35%,#3ab6d8,#0c4a62 75%);border:2px solid rgba(200,240,255,.75);box-shadow:0 2px 8px #0008,inset 0 2px 5px #fff3}
  #bPulo{right:226px;bottom:14px;width:62px;height:62px} #bDash{right:232px;bottom:86px;width:50px;height:50px} /* movimento: à esquerda das skills */
  .ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#d0742e,#5e2a0c 75%);border:1.5px solid rgba(255,225,190,.6)}
  .ico.M{background:radial-gradient(circle at 50% 35%,#5a74e8,#1a2370 75%);border-color:rgba(200,215,255,.6)} .ico.R{background:radial-gradient(circle at 50% 35%,#36c49a,#0c5040 75%);border-color:rgba(190,255,230,.6)}
  .ico svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  #ctl .sk.sem{opacity:.45}
  #ctl .sk[data-cd]::after{content:attr(data-cd);position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:15px}
  #faixa{position:absolute;left:0;right:0;top:26%;text-align:center;font:900 28px system-ui,sans-serif;color:#ffe066;text-shadow:0 3px 0 #a5560f,0 0 14px #000a;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;transform:scale(.8)}
  #faixa.on{opacity:1;transform:scale(1)}
  #faixa small{display:block;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;margin-top:4px}
  #nums div{position:absolute;left:0;top:0;font:800 18px system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #b2321f,0 0 6px #000a;pointer-events:none;white-space:nowrap;will-change:transform}
  #nums div.crit{color:#ffd23a;font-size:24px}
  #nums div.xp{color:#ffe066;text-shadow:0 2px 0 #8a5a00,0 0 6px #000a;font-size:17px}
  #nums div.ouro{color:#ffd86b;text-shadow:0 2px 0 #6b4a00,0 0 6px #000a;font-size:15px}
  #nums div.dor{color:#ff8a7a;text-shadow:0 2px 0 #5a0000,0 0 6px #000a}
  #nums div.cura{color:#8dffb0;text-shadow:0 2px 0 #0a5a2a,0 0 6px #000a}
  #barras div{position:absolute;left:0;top:0;width:52px;height:6px;margin-left:-26px;border-radius:3px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);overflow:hidden;pointer-events:none}
  #barras div i{display:block;height:100%;background:#ff5a4a;transform-origin:left}
  #barras div.chefe{width:80px;margin-left:-40px;height:8px} #barras div.chefe i{background:#c86bff}
  #dor{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;box-shadow:inset 0 0 46px 12px rgba(220,30,20,.45);opacity:0;transition:opacity .35s}
  #bEst{font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:999px;background:linear-gradient(#5b3a8a,#3a2560);border-color:#b98cff;white-space:nowrap}
  #bEst small{font-weight:700;opacity:.85;margin-left:4px}
  .pbar{height:14px;border-radius:8px;background:#2a3350;overflow:hidden;margin:6px 0 4px} .pbar i{display:block;height:100%;background:linear-gradient(90deg,#2f9a64,#7ddc8a);border-radius:8px}
  .pbar.chefe i{background:linear-gradient(90deg,#b0303a,#ff6a5a)}
  /* ---------- prêmio na frente de tudo (baú, chefe, conquistas, nível) ---------- */
  #premio{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(70,45,10,.95),rgba(4,6,12,.98));padding:10px;overflow:hidden;cursor:pointer}
  #premio.on{display:flex}
  .pCx{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:440px;max-height:100%}
  .pCx h2{position:relative;z-index:3;margin:0;font:900 24px system-ui,sans-serif;color:#ffe066;text-shadow:0 3px 0 #a5560f,0 0 14px #000a}
  .pCx .pSub{position:relative;z-index:3;color:#f4e6c2;font-size:13px;font-weight:700;margin-top:2px}
  .palco{position:relative;width:190px;height:142px;display:grid;place-items:end center;padding-bottom:8px;flex:none}
  .raios{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(rgba(255,220,110,.42) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);
    opacity:0;transform:scale(.3);transition:opacity .5s,transform .7s cubic-bezier(.3,1.5,.5,1)}
  .aberto .raios{opacity:1;transform:scale(1);animation:gira 9s linear infinite}
  @keyframes gira{to{rotate:360deg}}
  .bauG{position:relative;width:124px;height:100px}
  .bauG .corpo{position:absolute;left:0;right:0;bottom:0;height:62px;border-radius:6px 6px 12px 12px;border:3px solid #ffd23a;box-shadow:0 10px 24px #000b;
    background:linear-gradient(90deg,transparent 43%,#ffd23a 43% 57%,transparent 57%),repeating-linear-gradient(#a8622a 0 14px,#8f501f 14px 16px)}
  .bauG .corpo::after{content:'';position:absolute;left:50%;top:6px;width:16px;height:18px;margin-left:-8px;border-radius:4px;background:#5a3510;border:2px solid #ffe28a}
  .bauG .tampa{position:absolute;left:-5px;right:-5px;top:6px;height:38px;border-radius:44px 44px 6px 6px;border:3px solid #ffd23a;z-index:2;transform-origin:8% 100%;transition:transform .5s cubic-bezier(.3,1.7,.5,1);
    background:linear-gradient(90deg,transparent 43%,#ffd23a 43% 57%,transparent 57%),linear-gradient(#c97c3c,#874a1c)}
  .bauG::before{content:'';position:absolute;left:14px;right:14px;top:36px;height:14px;border-radius:50%;background:#fff6c8;box-shadow:0 0 34px 22px #ffd86b;opacity:0;transition:opacity .4s .12s;z-index:1}
  .fechado .bauG{animation:treme 1s ease-in-out infinite}
  @keyframes treme{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-8deg) scale(1.04)}75%{transform:rotate(8deg) scale(1.04)}85%{transform:rotate(-4deg)}}
  .aberto .bauG{animation:pula .5s cubic-bezier(.3,1.6,.5,1)} .aberto .bauG .tampa{transform:translate(-6px,-8px) rotate(-32deg)} .aberto .bauG::before{opacity:1}
  @keyframes pula{0%{transform:scale(.9)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .pIc{position:relative;align-self:center;font-size:86px;line-height:1;animation:salta .6s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 6px 10px #000a)}
  @keyframes salta{from{transform:scale(.2) rotate(-20deg)}to{transform:none}}
  .pDica{color:#fff;font-weight:800;font-size:15px;min-height:20px;margin:2px 0;animation:pdica .8s ease-in-out infinite alternate}
  @keyframes pdica{from{opacity:.45}to{opacity:1}}
  .pIts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 10px}
  .pIt{display:flex;align-items:center;gap:8px;background:rgba(18,22,38,.92);border:1px solid #ffd86b99;border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px;color:#fff;opacity:0}
  .pIt b{font-size:26px;line-height:1}
  .aberto .pIt{animation:entra .5s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes entra{from{opacity:0;transform:translateY(22px) scale(.5)}to{opacity:1;transform:none}}
  .pOk{padding:11px 38px;font-weight:900;font-size:16px;border-radius:999px;background:linear-gradient(#ffd85a,#e09a1a);color:#3a2000;border:2px solid #fff3c4;visibility:hidden}
  .aberto .pOk{visibility:visible;animation:entra .4s .8s both}
  @media (max-height:440px){ .palco{height:118px} .bauG{transform:scale(.85)} .pIc{font-size:70px} .pCx h2{font-size:21px} }
  /* hoje: hábitos bons de um toque, missões e masmorra */
  .mis{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px} .mis span{flex:1} .mis small{color:var(--fg2);font-weight:700;white-space:nowrap}
  .mis.ok span{text-decoration:line-through;color:var(--fg2)} .mis.ok small{color:#7ddc8a}
  .tag.foco{background:#5a4610;color:#ffe066}
  .tal{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)} .tal .nm{flex:1} .tal .nm b{display:block;font-size:14px} .tal .nm small{color:var(--fg2);font-size:12px}
  .tal .v{font-weight:900;color:#ffe066;min-width:34px;text-align:center} .tal button{width:38px;height:38px;padding:0;font-size:20px;font-weight:900}
  #mapa .masm{position:absolute;right:10px;top:10px;z-index:2;padding:8px 12px;border-radius:12px;font:800 13px system-ui,sans-serif;color:#fff;background:linear-gradient(#5b2a8a,#2e1450);border:2px solid #c99cff;box-shadow:0 3px 10px #000a}
  #mapa .masm.off{opacity:.7;filter:saturate(.4)}
  .hojeBar{background:var(--card);border-radius:12px;padding:8px 12px;margin:4px 0 8px}
  .hojeBar small{display:block;color:var(--fg2);font-size:12px;margin-top:3px} .hojeBar b{font-size:13.5px}
  .hTopo{display:flex;align-items:center;gap:8px} .hTopo b{flex:1;min-width:0}
  .bauMini{flex:none;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;background:#2a3350;color:var(--fg2)}
  .bauMini.pronto{background:linear-gradient(#ffd86b,#d08a1a);color:#3a2000;border:2px solid #fff3c4;animation:pulsa 1.2s ease-in-out infinite}
  .bauMini.aberto{background:#1f4a35;color:#bff0cf;border-color:#2f9a64}
  .hMais{display:block;width:100%;margin-top:6px;padding:5px 0 0;background:none;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;font-size:12.5px;font-weight:700;color:var(--fg2)}
  .hDet{margin-top:4px} .hDet>b{display:block;margin-top:8px;font-size:13px} .hDet .hsub{color:var(--fg2);font-size:12.5px;margin:4px 0}
  .conq{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px} .conq div{background:var(--card2);border-radius:10px;padding:7px 4px;text-align:center;font-size:11px;color:var(--fg2)}
  .conq div b{display:block;font-size:24px} .conq div.off{opacity:.35;filter:grayscale(1)} .conq div span{display:block;color:var(--fg);font-weight:700;font-size:11.5px}
  .graf{width:100%;max-width:480px;height:auto;display:block;margin:0 auto} .tend{display:flex;justify-content:space-between;font-size:13px;padding:4px 2px;border-bottom:1px solid var(--line)} .tend .up{color:#7ddc8a;font-weight:800} .tend .dn{color:#ff8a7a;font-weight:800}
  #calTela{position:fixed;top:0;right:0;bottom:0;left:0;z-index:32;display:none;flex-direction:column;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  #calTela.on{display:flex}
  .calCab{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)} .calCab b{font-size:17px}
  .calCab .fecha{width:42px;height:42px;padding:0;font-size:18px;border-radius:10px}
  .calCorpo{flex:1;min-height:0;display:flex;gap:12px;padding:10px 12px}
  .calEsq{flex:1.15;min-width:0;overflow-y:auto} .calDir{flex:1;min-width:0;overflow-y:auto;padding-bottom:20px}
  .calDir h3{margin:2px 0 4px;font-size:16px}
  .calG{gap:4px;margin:6px 0} .calG button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:38px;padding:2px 0;line-height:1.05}
  .calG button .n{font-size:15px;font-weight:800;background:none;padding:0;color:inherit} .calG button small{font-size:10px;font-weight:700;opacity:.9;min-height:11px}
  .calRes{display:flex;gap:6px} .calRes div{flex:1;background:var(--card);border-radius:10px;padding:7px 6px;text-align:center}
  .calRes b{display:block;font-size:18px} .calRes small{color:var(--fg2);font-size:11px}
  .calLeg{font-size:11.5px;color:var(--fg2);margin-top:6px;text-align:center}
  @media (orientation:landscape) and (max-height:520px){ /* celular deitado: jogo à esquerda, tarefas à direita (empilhado não sobrava espaço pra lista) */
    body{flex-direction:row} #arena{flex:1 1 0;min-width:0;min-height:0;height:100%} #painel{flex:0 0 min(46%,440px);min-width:0;border-top:none;border-left:1px solid var(--line)}
    body.cheio #arena{flex:1 1 0} body.cheio #puxa{writing-mode:vertical-rl;height:100%;width:38px;padding:0 0 0 env(safe-area-inset-right,0px)}}
  @media (orientation:portrait){.calCorpo{flex-direction:column;overflow-y:auto}.calEsq,.calDir{overflow:visible;flex:none}}
  #mapa{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:none;background:#1a120b;touch-action:pan-y} /* fica no lugar da heroína: as tarefas continuam do lado */
  #mapa.on{display:block}
  #mapa .rolo{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #mapa .folha{position:relative;width:100%;max-width:560px;margin:0 auto}
  #mapa canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #mapa .topo{position:absolute;left:0;right:0;top:0;padding:10px 14px 18px;background:linear-gradient(#1a120bee,#1a120b00);pointer-events:none;text-align:center}
  #mapa .topo b{display:inline-block;padding:6px 22px;font:700 19px Georgia,'Times New Roman',serif;letter-spacing:.5px;color:#4a2a10;background:linear-gradient(#f3e2b4,#d9bd7f);border:2px solid #8a5a24;border-radius:6px;box-shadow:0 3px 8px #0008}
  #mapa .topo small{display:block;margin-top:5px;font:600 12px Georgia,serif;color:#f0dcae;text-shadow:0 1px 2px #000}
  #mapa .no{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;padding:0;font:700 20px Georgia,serif;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a22 60%,#8a5a10);color:#4a2a00;border:3px solid #fff3c4;box-shadow:0 3px 0 #0006,0 0 0 3px #5a3a1055}
  #mapa .no.feito{background:radial-gradient(circle at 35% 30%,#e0584a,#a8231a 60%,#5a0e08);color:#ffe3a0;border-color:#e8b060}
  #mapa .no.atual{animation:pulsa 1.2s ease-in-out infinite}
  #mapa .no.tranc{background:radial-gradient(circle at 35% 30%,#b8b0a0,#7a7264 65%,#4a443a);color:#efe6d0;border-color:#a89e88;font-size:17px}
