<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>New Game Anime — vila de teste</title>
<style>
  :root{--bg:#9fc7e8;--fg:#f4f6fb;--glass:rgba(20,26,40,.55);--line:rgba(255,255,255,.28);--accent:#f0a83a;--ink:#16130e;color-scheme:dark}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas{display:block;touch-action:none}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 10px;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  #top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;
    padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
  #chars{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  #chars::-webkit-scrollbar{display:none}
  #chars button{font-size:12px;padding:6px 9px}
  #info{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(46px + env(safe-area-inset-top,0px));font-size:12px;opacity:.85;text-shadow:0 1px 2px #0008}
  /* joystick */
  #stick{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;
    background:var(--glass);border:1px solid var(--line);pointer-events:none}
  #knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
  /* botões de ação */
  #acts{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:200px;height:200px}
  #acts button{position:absolute;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:600;font-size:12px}
  #bJump{right:0;bottom:0;width:82px;height:82px;font-size:14px!important}
  #bDash{right:92px;bottom:4px;width:62px;height:62px}
  #bEsq{right:78px;bottom:76px;width:58px;height:58px}
  #bRun{right:4px;bottom:92px;width:62px;height:62px}
  #bMenu{right:140px;bottom:140px;width:46px;height:46px;font-size:20px!important}
  #menu{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(220px + env(safe-area-inset-bottom,0px));max-width:min(320px,calc(100vw - 36px));
    display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  #menu button{font-size:12px}
  #menu[hidden]{display:none}
  #menu .lin{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;width:100%}
  #menu .lin span{font-size:11px;opacity:.85;text-shadow:0 1px 2px #0008;margin-right:2px}
  #zoom{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
  #zoom button{width:46px;height:46px;border-radius:50%;padding:0;font-size:24px;line-height:1;display:grid;place-items:center}
  #zoom #bSlow{font-size:13px;font-weight:700}
  #help{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;opacity:.7;text-shadow:0 1px 2px #0008;pointer-events:none}
  @media (hover:hover) and (pointer:fine){ #help{opacity:.85} }
</style></head>
<body>
<div id="top"><div id="chars"></div><button id="bGal" title="Galeria de animações">Galeria</button></div>
<div id="info">carregando…</div>
<div id="stick"><div id="knob"></div></div>
<div id="acts">
  <button id="bMenu" aria-label="Outras animações">⋯</button>
  <button id="bRun">Correr</button>
  <button id="bEsq">Esquiva</button>
  <button id="bDash">Dash</button>
  <button id="bJump">Pular</button>
</div>
<div id="zoom"><button id="bSlow" aria-label="Câmera lenta">1x</button></div>
<div id="menu" hidden></div>
<div id="help">arraste pra girar a câmera · pinça pra aproximar/afastar · 1x/½x/¼x câmera lenta · pule 2x pra cambalhota · PC: WASD, Espaço, C (dash), Q (esquiva), Shift, roda do mouse</div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/vrm_char.js"></script>
<script>
// Vila de teste do New Game Anime: anda, corre, pula, cambalhota, dash e animações, com a física de cabelo/roupa.
// Só pra testar personagens e movimentos; não tem NPC nem missão.
const PERS = [
  ['sendagaya_shino', 'Shino'], ['sendagaya_shibu', 'Shibu'], ['darkness_shibu', 'Darkness Shibu'], ['sakurada_fumiriya', 'Fumiriya'],
  ['victoria_rubin', 'Victoria Rubin'], ['vita', 'Vita'], ['vivi', 'Vivi'], ['hairsample_female', 'Cabelo (moça)'], ['hairsample_male', 'Cabelo (rapaz)'],
  ['avatarsample_a', 'Avatar A'], ['avatarsample_b', 'Avatar B'], ['avatarsample_c', 'Avatar C'],
];
const EXTRAS = [['Melee_1H_Attack_Slice_Diagonal', 'Ataque'], ['Melee_2H_Attack_Spin', 'Giro'], ['Melee_Block', 'Defesa'], ['Ranged_Magic_Shoot', 'Magia'],
  ['Ranged_Magic_Summon', 'Invocar'], ['Ranged_Magic_Raise', 'Curar'], ['Interact', 'Interagir'], ['PickUp', 'Pegar'], ['Chopping', 'Machado'],
  ['Pickaxing', 'Picareta'], ['Hit_A', 'Dano'], ['Death_A', 'Morte'], ['Sit_Floor_Idle', 'Sentar'], ['Sit_Chair_Idle', 'Sentar (cadeira)']];
const LOOP_EXTRA = new Set(['Sit_Floor_Idle', 'Sit_Chair_Idle', 'Melee_Block']);
// números do Quimera Sandbox, onde o personagem tem 2,42 de altura; aqui tudo é multiplicado por K = altura real / 2,42,
// pra o movimento ter o mesmo ritmo (passada, pulo, dash e cambalhota na mesma proporção do corpo)
const Q = { WALK: 2.2, RUN: 4.6, GRAV: 17, JUMPV: 7.2, DASH_V: 15, FLIP_D: 1.02, DASH_UP: 0.55 }, ALT_Q = 2.42;
let K = 0.64, WALK, RUN, GRAV, JUMPV, DASH_V, FLIP_D, DASH_UP;
function escala(k) { K = k; WALK = Q.WALK * k; RUN = Q.RUN * k; GRAV = Q.GRAV * k; JUMPV = Q.JUMPV * k; DASH_V = Q.DASH_V * k; FLIP_D = Q.FLIP_D * k; DASH_UP = Q.DASH_UP * k }
escala(K);
const FLIP_T = 0.56, DASH_T = 0.2, RAD = 0.32, STEP = 0.45;

// ---------------- cena ----------------
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.outputEncoding = THREE.sRGBEncoding;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.prepend(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x9fc7e8); sc.fog = new THREE.Fog(0x9fc7e8, 40, 95);
sc.add(new THREE.HemisphereLight(0xeef3ff, 0x4a6a38, 0.75));
const sol = new THREE.DirectionalLight(0xfff1d6, 0.85); sol.castShadow = true; sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); sol.shadow.bias = -0.0005; sc.add(sol, sol.target);
const cam = new THREE.PerspectiveCamera(50, 1, 0.03, 140);
function tam() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() } addEventListener('resize', tam); tam();

const M = c => new THREE.MeshLambertMaterial({ color: new THREE.Color(c).convertSRGBToLinear() });
const mat = { grama: M(0x7fb35a), terra: M(0xc9a978), pedra: M(0xb9b4ac), parede: M(0xf1e6d2), madeira: M(0x8a5a36), telhaV: M(0xc4553e),
  telhaA: M(0x4f78b8), telhaT: M(0x3f8a6a), porta: M(0x6b4226), tronco: M(0x7a5233), folha: M(0x4f9a4a), folha2: M(0x6bb04f), agua: M(0x5aa7d8), caixa: M(0xb98a52), cerca: M(0xa77b4f) };
function malha(g, m, x, y, z, sombra = true) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = sombra; o.receiveShadow = true; sc.add(o); return o }

// chão e caminhos
const chao = malha(new THREE.PlaneGeometry(80, 80), mat.grama, 0, 0, 0, false); chao.rotation.x = -Math.PI / 2;
for (const [w, d] of [[3, 56], [56, 3]]) { const p = malha(new THREE.PlaneGeometry(w, d), mat.terra, 0, 0.01, 0, false); p.rotation.x = -Math.PI / 2 }
const praca = malha(new THREE.CircleGeometry(5.5, 40), mat.pedra, 0, 0.015, 0, false); praca.rotation.x = -Math.PI / 2;

// colisão: caixas no plano (x, z, meia-largura, meia-profundidade, topo). topo baixo = dá pra subir/pular em cima
const SOL = [];
function bloco(x, z, w, d, h, m, y0 = 0) { const o = malha(new THREE.BoxGeometry(w, h, d), m, x, y0 + h / 2, z); SOL.push({ x, z, hw: w / 2, hd: d / 2, top: y0 + h }); return o }

// casinhas
function casa(x, z, w, d, rot, telha) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; sc.add(g);
  const add = (geo, m, px, py, pz) => { const o = new THREE.Mesh(geo, m); o.position.set(px, py, pz); o.castShadow = o.receiveShadow = true; g.add(o); return o };
  add(new THREE.BoxGeometry(w, 2.6, d), mat.parede, 0, 1.3, 0);
  const tel = add(new THREE.CylinderGeometry(0.01, Math.max(w, d) * 0.78, 1.8, 4, 1), telha, 0, 3.5, 0); tel.rotation.y = Math.PI / 4; tel.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d));
  add(new THREE.BoxGeometry(1, 1.7, 0.08), mat.porta, 0, 0.85, d / 2 + 0.04);
  for (const s of [-1, 1]) add(new THREE.BoxGeometry(0.7, 0.6, 0.08), mat.agua, s * w * 0.3, 1.6, d / 2 + 0.04);
  const c = Math.abs(Math.cos(rot)) > 0.5; SOL.push({ x, z, hw: (c ? w : d) / 2, hd: (c ? d : w) / 2, top: 99 });
}
casa(-9, -9, 5, 4, 0, mat.telhaV); casa(9, -9, 4.5, 4.5, 0, mat.telhaA); casa(-10, 9, 4, 5, Math.PI, mat.telhaT);
casa(10, 10, 5, 4, Math.PI, mat.telhaV); casa(-20, -2, 4, 4, Math.PI / 2, mat.telhaA); casa(20, 3, 4.5, 4, -Math.PI / 2, mat.telhaT);

// fonte na praça
bloco(0, 0, 2.6, 2.6, 0.55, mat.pedra); malha(new THREE.BoxGeometry(2.1, 0.05, 2.1), mat.agua, 0, 0.56, 0, false);
bloco(0, 0, 0.5, 0.5, 1.5, mat.pedra, 0.55);

// caixotes e escadinha pra testar pulo e degrau
bloco(5, 4, 0.9, 0.9, 0.8, mat.caixa); bloco(6.1, 4, 0.9, 0.9, 1.6, mat.caixa); bloco(6.1, 5.1, 0.9, 0.9, 0.8, mat.caixa);
for (let i = 0; i < 4; i++) bloco(-5 - i * 0.7, 5, 0.7, 2, 0.35 * (i + 1), mat.madeira);
bloco(-8.6, 5, 1.8, 2.6, 1.4, mat.madeira);
bloco(4.5, -5.5, 3, 0.4, 0.5, mat.madeira); // banco

// árvores (instanciadas) e cerca em volta
const posArv = [];
for (let i = 0; i < 46; i++) { const a = i / 46 * Math.PI * 2 + (i % 3) * 0.05, rr = 24 + (i % 4) * 1.4; posArv.push([Math.cos(a) * rr, Math.sin(a) * rr]) }
for (const p of [[-15, -14], [15, -15], [-15, 15], [16, 15], [-4, -15], [5, 15], [-14, 4], [14, -4]]) posArv.push(p);
const tronco = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.3, 1.6, 7), mat.tronco, posArv.length);
const copa = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.4, 0), mat.folha, posArv.length);
const copa2 = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.0, 0), mat.folha2, posArv.length);
const _m = new THREE.Matrix4(), _q0 = new THREE.Quaternion(), _s0 = new THREE.Vector3();
posArv.forEach(([x, z], i) => {
  const k = 0.85 + ((i * 37) % 10) / 25; _s0.set(k, k, k);
  tronco.setMatrixAt(i, _m.compose(new THREE.Vector3(x, 0.8 * k, z), _q0, _s0));
  copa.setMatrixAt(i, _m.compose(new THREE.Vector3(x, 2.3 * k, z), _q0, _s0));
  copa2.setMatrixAt(i, _m.compose(new THREE.Vector3(x + 0.3, 3.1 * k, z - 0.2), _q0, _s0));
  SOL.push({ x, z, hw: 0.3, hd: 0.3, top: 99 });
});
for (const o of [tronco, copa, copa2]) { o.castShadow = o.receiveShadow = true; sc.add(o) }
const LIM = 22; // cerca
for (const [x, z, w, d] of [[0, -LIM, LIM * 2, 0.15], [0, LIM, LIM * 2, 0.15], [-LIM, 0, 0.15, LIM * 2], [LIM, 0, 0.15, LIM * 2]]) {
  malha(new THREE.BoxGeometry(w, 0.12, d), mat.cerca, x, 0.75, z); malha(new THREE.BoxGeometry(w, 0.12, d), mat.cerca, x, 0.4, z);
}
const postes = new THREE.InstancedMesh(new THREE.BoxGeometry(0.16, 1, 0.16), mat.cerca, 88); let np = 0;
for (let i = -LIM; i <= LIM; i += 2) for (const [x, z] of [[i, -LIM], [i, LIM], [-LIM, i], [LIM, i]]) if (np < 88) postes.setMatrixAt(np++, _m.makeTranslation(x, 0.5, z));
postes.count = np; postes.castShadow = true; sc.add(postes);

// ---------------- personagem ----------------
const P = { x: 0, z: 3.2, y: 0, vy: 0, face: Math.PI, sp: 0, chao: true, pulos: 0, flip: 0, dash: 0, dashX: 0, ddx: 0, ddz: 0, run: true, extra: null, extraT: 0,
  jt: 9, land: 0, landN: null, flipT: FLIP_T, dashT: DASH_T, dashV: 0, tipo: 'rapido', climb: 0, climbT: 1, cy0: 0, cy1: 0, climbV: 0 };
// estilos escolhidos no menu ⋯ (lembra no aparelho)
const ESTILO = { pulo: 'mixamo', duplo: 'Flip_Front', dash: 'rapido', esq: 'Roll_Quick' };
try { Object.assign(ESTILO, JSON.parse(localStorage.getItem('nga-estilo') || '{}')) } catch (e) {}
const OPC = {
  pulo: [['mixamo', 'Pulo novo'], ['antigo', 'Pulo antigo']],
  duplo: [['Flip_Front', 'Mortal pra frente'], ['Flip_Back', 'Mortal pra trás'], ['classico', 'Cambalhota antiga']],
  dash: [['rapido', 'Arrancada com rastro'], ['voo', 'Voo antigo']],
  esq: [['Roll_Quick', 'Rolamento'], ['Roll_Dive', 'Mergulho'], ['Roll_Sprint', 'Arrancada rolando'], ['Slide', 'Deslizar']],
};
const DASH_DIST = { Roll_Quick: 4.2, Roll_Dive: 4.6, Roll_Sprint: 3.8, Slide: 5.0 };
if (ESTILO.dash !== 'rapido' && ESTILO.dash !== 'voo') ESTILO.dash = 'rapido'; // escolha antiga (rolamento) foi pra Esquiva // distância do rolamento em "metros do Quimera" (vezes K)
const player = new THREE.Group(), corpo = new THREE.Group(); player.add(corpo); sc.add(player);
let R = null, mix = null, cur = null, pedido = 0; const cache = {};
const info = document.getElementById('info');
function carregar(i) {
  const [arq, nome] = PERS[i], meu = ++pedido; info.textContent = 'carregando ' + nome + '…';
  [...document.getElementById('chars').children].forEach((b, k) => b.classList.toggle('on', k === i));
  (cache[arq] || (cache[arq] = new Promise((ok, erro) => new THREE.GLTFLoader().load('personagens/' + arq + '.glb', ok, undefined, erro)))).then(gl => {
    if (meu !== pedido) return;
    if (R) { corpo.remove(R.root); mix.stopAllAction() }
    if (!gl.__A) gl.__A = VRMC.prep(gl);
    const A = gl.__A, root = A.gl.scene; corpo.add(root); root.userData.vrm.J = null;
    root.traverse(o => { if (o.isMesh) { o.castShadow = !o.material.transparent; o.receiveShadow = true } });
    mix = new THREE.AnimationMixer(root); R = { root, act: {} }; cur = null;
    for (const c of A.an.animations) R.act[c.name] = mix.clipAction(c.clone());
    root.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(root), alt = Math.max(0.8, bb.max.y - bb.min.y);
    escala(alt / ALT_Q);
    VRMC.fix(R, RUN, WALK); // passada casada com a velocidade, igual ao Quimera
    info.textContent = nome; P.extra = null; menuMontar();
  }).catch(() => { if (meu === pedido) info.textContent = 'Não consegui carregar ' + nome + '. Toque de novo.'; delete cache[arq] });
  try { localStorage.setItem('nga-pers', i) } catch (e) {}
}
const ONCE = new Set(['Climb_Up', 'Slide_Start', 'Slide_Exit', 'Jump_Full_Short', 'Dodge_Forward', 'Jump_Start', 'Jump_Run', 'Land_A', 'Land_B', 'Flip_Front', 'Flip_Back', 'Roll_Quick', 'Roll_Dive', 'Roll_Sprint', 'Death_A', 'Hit_A', 'Melee_1H_Attack_Slice_Diagonal', 'Melee_2H_Attack_Spin', 'Ranged_Magic_Shoot',
  'Ranged_Magic_Summon', 'Ranged_Magic_Raise', 'Interact', 'PickUp']);
function tocar(n, rate = 1, fade = 0.15) {
  const a = R && R.act[n]; if (!a) return;
  if (cur !== n) {
    const prev = R.act[cur]; a.reset(); a.setLoop(ONCE.has(n) ? THREE.LoopOnce : THREE.LoopRepeat); a.clampWhenFinished = true; a.play();
    if (prev) a.crossFadeFrom(prev, fade, false); cur = n;
  }
  a.timeScale = rate;
}

// ---------------- controles ----------------
const tecla = new Set(), stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 }, camT = new Map();
let yaw = 0, pitch = 0.32, dist = 5.2, pinch = 0, zoomV = 0, lento = 1;
const ZMIN = 0.9, ZMAX = 22;
const knob = document.getElementById('knob'), stickEl = document.getElementById('stick');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if (e.repeat) return; tecla.add(k);
  if (k === ' ') pular(); if (k === 'c') dash(); if (k === 'q' || k === 'e') esquiva(); if (k === 'shift') P.run = !P.run, atualRun(); if (k === '+' || k === '=') dist = Math.max(ZMIN, dist / 1.2); if (k === '-') dist = Math.min(ZMAX, dist * 1.2);
});
addEventListener('keyup', e => tecla.delete(e.key.toLowerCase()));
const cv = r.domElement;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  if (stick.id == null && e.clientX < innerWidth * 0.45 && e.clientY > innerHeight * 0.35) {
    Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, t: e.timeStamp, lx: e.clientX, ly: e.clientY });
    stickEl.style.left = (e.clientX - 64) + 'px'; stickEl.style.top = (e.clientY - 64) + 'px'; stickEl.style.bottom = 'auto';
  } else {
    // segundo dedo logo depois e o primeiro quase parado: era pinça, não joystick
    if (stick.id != null && e.timeStamp - stick.t < 350 && Math.hypot(stick.dx, stick.dy) < 0.25) {
      camT.set(stick.id, [stick.lx, stick.ly]); stick.id = null; stick.dx = stick.dy = 0; knob.style.transform = ''; stickEl.style.left = ''; stickEl.style.top = ''; stickEl.style.bottom = '';
    }
    camT.set(e.pointerId, [e.clientX, e.clientY]);
  }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    stick.lx = e.clientX; stick.ly = e.clientY; let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const l = Math.hypot(dx, dy), max = 52; if (l > max) dx *= max / l, dy *= max / l;
    stick.dx = dx / max; stick.dy = dy / max; knob.style.transform = `translate(${dx}px,${dy}px)`; return;
  }
  if (!camT.has(e.pointerId)) return; const [x0, y0] = camT.get(e.pointerId); camT.set(e.pointerId, [e.clientX, e.clientY]);
  if (camT.size === 1) { if (!pinch) { yaw -= (e.clientX - x0) * 0.008; pitch = Math.min(1.25, Math.max(-0.15, pitch + (e.clientY - y0) * 0.005)) } }
  else { const p = [...camT.values()], d = Math.max(20, Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1])); if (pinch > 0) dist = Math.min(ZMAX, Math.max(ZMIN, dist * (pinch / d))); pinch = d }
});
const solta = e => {
  if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; knob.style.transform = ''; stickEl.style.left = ''; stickEl.style.top = ''; stickEl.style.bottom = '' }
  camT.delete(e.pointerId); if (camT.size === 0) pinch = 0; else if (pinch) pinch = -1;
};
cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);
addEventListener('wheel', e => dist = Math.min(ZMAX, Math.max(ZMIN, dist * Math.exp(e.deltaY * 0.0012))), { passive: true });
document.getElementById('bSlow').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); lento = lento === 1 ? 0.5 : lento === 0.5 ? 0.25 : 1;
  const b = document.getElementById('bSlow'); b.textContent = lento === 1 ? '1x' : lento === 0.5 ? '½x' : '¼x'; b.classList.toggle('on', lento !== 1);
});
const botao = (id, f) => document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); f() });
botao('bJump', pular); botao('bDash', dash); botao('bEsq', esquiva); botao('bRun', () => { P.run = !P.run; atualRun() });
botao('bMenu', () => { const m = document.getElementById('menu'); m.hidden = !m.hidden });
document.getElementById('bGal').onclick = () => location.href = 'galeria.html';
function atualRun() { document.getElementById('bRun').classList.toggle('on', P.run) } atualRun();
function menuMontar() {
  const m = document.getElementById('menu'); m.textContent = '';
  for (const [k, titulo] of [['pulo', 'Pulo'], ['duplo', 'Pulo duplo'], ['dash', 'Dash'], ['esq', 'Esquiva']]) {
    const lin = document.createElement('div'); lin.className = 'lin'; const t = document.createElement('span'); t.textContent = titulo; lin.append(t);
    for (const [v, nome] of OPC[k]) {
      if (!['antigo', 'classico', 'voo', 'mixamo', 'rapido'].includes(v) && !R.act[v === 'Slide' ? 'Slide_Start' : v]) continue;
      const b = document.createElement('button'); b.textContent = nome; b.classList.toggle('on', ESTILO[k] === v);
      b.onclick = () => { ESTILO[k] = v; try { localStorage.setItem('nga-estilo', JSON.stringify(ESTILO)) } catch (e) {} menuMontar() }; lin.append(b);
    }
    m.append(lin);
  }
  const sep = document.createElement('div'); sep.className = 'lin'; sep.innerHTML = '<span>Animações</span>'; m.append(sep);
  for (const [n, t] of EXTRAS) if (R.act[n]) { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { P.extra = n; P.extraT = 0; m.hidden = true }; m.append(b) }
}

function pular() {
  if (!R || P.dash > 0 || P.climb > 0) return; P.extra = null;
  if (P.chao) { P.vy = JUMPV; P.chao = false; P.pulos = 1; P.jt = 0; P.land = 0 }
  else if (P.pulos < 2) {
    P.vy = Math.max(P.vy, JUMPV * 0.9); P.pulos = 2; P.flip = 0.001;
    P.flipT = ESTILO.duplo !== 'classico' && R.act[ESTILO.duplo] ? R.act[ESTILO.duplo].getClip().duration : FLIP_T;
  }
}
function dash() { // arrancada rápida reta, sem rolar, com rastro
  if (!R || P.dash > 0 || P.dashCd > 0 || P.climb > 0) return; P.extra = null; P.flip = 0; P.land = 0;
  P.ddx = Math.sin(P.face); P.ddz = Math.cos(P.face); P.tipo = ESTILO.dash;
  if (P.tipo === 'voo') { P.dashT = DASH_T; P.dashV = DASH_V } else { P.dashT = 0.28; P.dashV = 14 * K }
  P.dash = P.dashT; P.dashCd = 0.35; if (!P.chao) P.vy = Math.max(0, P.vy); rastroLiga();
}
function esquiva() { // rolamento / mergulho / deslizar
  if (!R || P.dash > 0 || P.dashCd > 0 || P.climb > 0) return; P.extra = null; P.flip = 0; P.land = 0;
  P.ddx = Math.sin(P.face); P.ddz = Math.cos(P.face); P.tipo = ESTILO.esq;
  const clip = P.tipo === 'Slide' ? null : R.act[P.tipo] && R.act[P.tipo].getClip();
  P.dashT = clip ? clip.duration : 1.0; P.dashV = DASH_DIST[P.tipo] * K / P.dashT;
  P.dash = P.dashT; P.dashCd = 0.3; if (!P.chao) P.vy = Math.max(0, P.vy);
}

// rastro do dash: faixa azul-clara suave (forte no meio do corpo, some em cima, embaixo e no fim)
const RN = 28, RV = 5, rastroPts = [], rastroGeo = new THREE.BufferGeometry();
rastroGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(RN * RV * 3), 3));
rastroGeo.setAttribute('a', new THREE.BufferAttribute(new Float32Array(RN * RV), 1));
const idx = []; for (let i = 0; i < RN - 1; i++) for (let j = 0; j < RV - 1; j++) { const k = i * RV + j; idx.push(k, k + 1, k + RV, k + 1, k + RV + 1, k + RV) } rastroGeo.setIndex(idx);
const rastro = new THREE.Mesh(rastroGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  vertexShader: 'attribute float a; varying float va; void main(){ va = a; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'varying float va; void main(){ gl_FragColor = vec4(0.45, 0.78, 1.0, va); }'
}));
rastro.frustumCulled = false; rastro.visible = false; sc.add(rastro);
const PERFIL = [0, 0.55, 1, 0.7, 0]; // de baixo pra cima
let rastroT = 0; function rastroLiga() { if (P.tipo === 'voo') return; rastroPts.length = 0; rastroT = 0.5; rastro.visible = true }
function rastroPasso(dt) {
  if (!rastro.visible) return; rastroT -= dt;
  if (P.dash > 0 && P.tipo === 'rapido') rastroPts.unshift({ x: P.x, y: P.y, z: P.z, t: 0 });
  for (const p of rastroPts) p.t += dt; while (rastroPts.length > RN || (rastroPts.length && rastroPts[rastroPts.length - 1].t > 0.3)) rastroPts.pop();
  if (!rastroPts.length) { rastro.visible = false; return }
  const pos = rastroGeo.attributes.position.array, al = rastroGeo.attributes.a.array, H = 2.42 * K;
  for (let i = 0; i < RN; i++) {
    const p = rastroPts[Math.min(i, rastroPts.length - 1)], vive = i < rastroPts.length ? Math.max(0, 1 - p.t / 0.3) : 0, f = vive * (1 - i / RN) * 0.42;
    for (let j = 0; j < RV; j++) { const k = i * RV + j; pos[k * 3] = p.x; pos[k * 3 + 1] = p.y + H * (0.12 + 0.78 * j / (RV - 1)); pos[k * 3 + 2] = p.z; al[k] = f * PERFIL[j] }
  }
  rastroGeo.attributes.position.needsUpdate = rastroGeo.attributes.a.needsUpdate = true;
}

// ---------------- física simples ----------------
function chaoEm(x, z, y) { // altura do que está embaixo (só o que dá pra pisar: topo abaixo dos pés + degrau)
  let h = 0; for (const s of SOL) if (s.top < 50 && Math.abs(x - s.x) < s.hw + RAD * 0.6 && Math.abs(z - s.z) < s.hd + RAD * 0.6 && s.top <= y + STEP) h = Math.max(h, s.top);
  return h;
}
function empurra() { // não atravessa paredes, troncos e caixas altas demais
  for (const s of SOL) {
    if (s.top <= P.y + STEP && s.top < 50) continue;
    const dx = P.x - s.x, dz = P.z - s.z, ox = s.hw + RAD - Math.abs(dx), oz = s.hd + RAD - Math.abs(dz);
    if (ox > 0 && oz > 0) { if (ox < oz) P.x += Math.sign(dx) * ox; else P.z += Math.sign(dz) * oz }
  }
  const L = LIM - 0.5; P.x = Math.max(-L, Math.min(L, P.x)); P.z = Math.max(-L, Math.min(L, P.z));
}

const oq = x => x * x * (3 - 2 * x), ma = (x, a, b) => Math.min(b, Math.max(a, x));
const relogio = new THREE.Clock(), _v = new THREE.Vector3();
function passo(dt) {
  // direção do movimento relativa à câmera
  let ix = stick.dx, iz = stick.dy;
  if (tecla.has('a') || tecla.has('arrowleft')) ix -= 1; if (tecla.has('d') || tecla.has('arrowright')) ix += 1;
  if (tecla.has('w') || tecla.has('arrowup')) iz -= 1; if (tecla.has('s') || tecla.has('arrowdown')) iz += 1;
  let mag = Math.min(1, Math.hypot(ix, iz)); if (mag < 0.12) mag = 0;
  const alvo = mag ? (P.run && mag > 0.6 ? RUN : WALK) * (mag > 0.6 ? 1 : 0.5 + mag * 0.8) : 0;
  P.sp += (alvo - P.sp) * Math.min(1, dt * 10);
  if (mag) {
    const a = Math.atan2(ix, iz) + yaw, dir = Math.atan2(Math.sin(a), Math.cos(a));
    let d = dir - P.face; d = Math.atan2(Math.sin(d), Math.cos(d)); if (P.dash <= 0) P.face += d * Math.min(1, dt * 12);
    P.extra = LOOP_EXTRA.has(P.extra) ? null : P.extra;
  }
  if (P.dash > 0) {
    const x = 1 - P.dash / P.dashT, f = P.tipo === 'voo' ? 1 : P.tipo === 'rapido' ? 1.6 * (1 - x) ** 0.7 + 0.15 : P.tipo === 'Slide' ? 1.5 * (1 - x) ** 0.8 : 1.5 * Math.sin(Math.PI * Math.min(1, x * 1.05)) ** 0.6;
    P.dash -= dt; P.x += P.ddx * P.dashV * f * dt; P.z += P.ddz * P.dashV * f * dt; if (P.dash <= 0) P.dashX = P.tipo === 'voo' ? 0.4 : 0;
  }
  else if (P.sp > 0.01 && P.climb <= 0) { P.x += Math.sin(P.face) * P.sp * dt; P.z += Math.cos(P.face) * P.sp * dt }
  P.dashCd = Math.max(0, (P.dashCd || 0) - dt); P.dashX = Math.max(0, P.dashX - dt);
  if (P.climb > 0) { // subindo: sobe até o topo e avança por cima da borda
    P.climb -= dt; const t = 1 - Math.max(0, P.climb) / P.climbT, sobe = Math.min(1, t / 0.55);
    P.y = P.cy0 + (P.cy1 - P.cy0) * (sobe * sobe * (3 - 2 * sobe)); P.x += P.ddx * P.climbV * dt; P.z += P.ddz * P.climbV * dt;
    if (P.climb <= 0) { P.y = P.cy1; P.chao = true; P.vy = 0 }
  } else if (mag && P.chao && P.dash <= 0 && R.act.Climb_Up) {
    const fx = P.x + Math.sin(P.face) * (RAD + 0.25), fz = P.z + Math.cos(P.face) * (RAD + 0.25);
    for (const s of SOL) {
      const alt = s.top - P.y;
      if (s.top < 50 && alt > STEP && alt <= 1.5 * K && Math.abs(fx - s.x) < s.hw && Math.abs(fz - s.z) < s.hd) {
        P.climbT = R.act.Climb_Up.getClip().duration * 1.1; P.climb = P.climbT; P.cy0 = P.y; P.cy1 = s.top;
        P.ddx = Math.sin(P.face); P.ddz = Math.cos(P.face); P.climbV = (RAD + 0.55) / P.climbT; P.extra = null; P.land = 0; break;
      }
    }
  }
  if (P.climb <= 0) empurra();
  // gravidade e chão
  if (P.climb > 0) P.vy = 0; else if (P.dash <= 0 || (P.tipo !== 'voo' && P.tipo !== 'rapido' && !P.chao)) P.vy -= GRAV * dt; else P.vy = 0;
  if (P.climb > 0) { if (P.extra) P.extraT += dt; P.jt += dt; return }
  P.y += P.vy * dt; const g = chaoEm(P.x, P.z, P.y);
  if (P.y <= g) {
    if (!P.chao && ESTILO.pulo === 'mixamo' && P.dash <= 0 && P.vy < -3 * K) { P.landN = P.vy < -11 * K && R.act.Land_B ? 'Land_B' : 'Land_A'; P.land = R.act[P.landN] ? R.act[P.landN].getClip().duration : 0 }
    P.y = g; P.vy = 0; P.chao = true; P.pulos = 0; P.flip = 0;
  }
  else if (P.y - g > 0.08 || P.vy > 0) P.chao = false;
  else P.y = g; // descendo degrau
  if (P.flip > 0) { P.flip += dt; if (P.flip > P.flipT) P.flip = 0 }
  if (P.extra) P.extraT += dt;
  P.jt += dt; if (P.land > 0) { P.land -= dt; if (P.sp > 2.6 * K && P.land < (R.act[P.landN] ? R.act[P.landN].getClip().duration : 0) - 0.15) P.land = 0 }
}

function anima(dt) {
  if (!R) return;
  // escolhe a animação (mesma ordem do Quimera)
  const novoDuplo = ESTILO.duplo !== 'classico' && R.act[ESTILO.duplo], novoDash = P.dash > 0 && P.tipo !== 'voo';
  const novoPulo = ESTILO.pulo === 'mixamo' && R.act.Jump_Start;
  if (P.flip > 0) tocar(novoDuplo ? ESTILO.duplo : 'Jump_Full_Short', 1, 0.08);
  else if (P.climb > 0) tocar('Climb_Up', 1, 0.06);
  else if (P.dash > 0) {
    if (P.tipo === 'voo') tocar('Dodge_Forward', 1, 0.06);
    else if (P.tipo === 'rapido') tocar('Running_A', 1.9, 0.05);
    else if (P.tipo === 'Slide') { const x = 1 - P.dash / P.dashT; tocar(x < 0.55 ? 'Slide_Start' : x < 0.62 ? 'Slide_Loop' : 'Slide_Exit', 1.3, 0.12) }
    else tocar(P.tipo, 1, 0.06);
  }
  else if (!P.chao) {
    if (novoPulo && P.pulos === 1 && P.vy > 0 && P.jt < 0.45) tocar(P.sp > 2.6 * K && R.act.Jump_Run ? 'Jump_Run' : 'Jump_Start', 1, 0.08);
    else if (novoPulo) tocar('Fall_Idle', 1, 0.25);
    else tocar(P.vy < -2.5 * K ? 'Fall_Idle' : 'Jump_Idle', 1, 0.18);
  }
  else if (P.land > 0 && P.landN && R.act[P.landN]) tocar(P.landN, 1, 0.06);
  else if (P.extra) { tocar(P.extra); const a = R.act[P.extra]; if (!LOOP_EXTRA.has(P.extra) && P.extraT > a.getClip().duration + 0.05) P.extra = null }
  else if (P.sp > 2.6 * K) tocar('Running_A', Math.min(1.5, Math.max(0.75, P.sp / RUN)));
  else if (P.sp > 0.25 * K) tocar('Walking_A', Math.max(0.7, P.sp / WALK));
  else tocar('Idle_A');
  mix.update(dt);
  // o corpo gira na cambalhota e inclina no dash (igual ao Quimera)
  corpo.rotation.set(0, 0, 0); corpo.position.set(0, 0, 0);
  if (P.flip > 0 && !novoDuplo) { const t = ma(P.flip / FLIP_T, 0, 1), C = 6.2832 * oq(ma((t - 0.04) / 0.8, 0, 1)), D = FLIP_D; corpo.rotation.x = C; corpo.position.y = D - D * Math.cos(C); corpo.position.z = -D * Math.sin(C) }
  if (P.dash > 0 && P.tipo === 'rapido') { const x = 1 - P.dash / P.dashT; corpo.rotation.x = 0.42 * Math.sin(Math.PI * Math.min(1, x * 1.2)) }
  else if (P.dash > 0 && !novoDash) { const x = 1 - P.dash / DASH_T; if (x < 0.16) corpo.rotation.x = 0.38 * oq(x / 0.16); else { const y = oq(ma((x - 0.16) / 0.18, 0, 1)) * (x > 0.82 ? 1 - oq((x - 0.82) / 0.18) * 0.5 : 1); corpo.rotation.x = 0.38 + 0.82 * y; corpo.position.y = DASH_UP * y } }
  else if (P.dashX > 0) corpo.rotation.x = 0.42 * Math.pow(P.dashX / 0.4, 1.4);
  player.position.set(P.x, P.y, P.z); player.rotation.y = P.face;
  player.updateMatrixWorld(true); VRMC.tick(R, dt); rastroPasso(dt);
}

const alvoCam = new THREE.Vector3(P.x, 1.2, P.z);
function camera(dt) {
  _v.set(P.x, P.y + (dist < 2.5 ? 0.85 + (dist - ZMIN) * 0.25 : 1.25), P.z); alvoCam.lerp(_v, Math.min(1, dt * 8));
  const cp = Math.cos(pitch);
  cam.position.set(alvoCam.x + Math.sin(yaw) * cp * dist, alvoCam.y + Math.sin(pitch) * dist, alvoCam.z + Math.cos(yaw) * cp * dist);
  if (cam.position.y < 0.3) cam.position.y = 0.3;
  cam.lookAt(alvoCam);
  sol.position.set(P.x + 6, 14, P.z + 5); sol.target.position.set(P.x, 0, P.z);
}

// botões de personagem
PERS.forEach(([, nome], i) => { const b = document.createElement('button'); b.textContent = nome; b.onclick = () => carregar(i); document.getElementById('chars').append(b) });
let ini = 0; try { ini = Math.min(PERS.length - 1, +localStorage.getItem('nga-pers') || 0) } catch (e) {}
carregar(ini); document.getElementById('chars').children[ini].scrollIntoView({ inline: 'center' });
yaw = P.face + Math.PI; // começa olhando por trás
window.VILA = { P, get cur() { return cur }, get R() { return R }, get K() { return K }, set yaw(v) { yaw = v }, camDist: () => dist, sim(n, dt = 1 / 60) { for (let i = 0; i < n; i++) { passo(dt); anima(dt) } }, pular, dash, esquiva, tecla, ESTILO }; // pra testes

r.setAnimationLoop(() => {
  const real = Math.min(0.05, relogio.getDelta()), dt = real * lento;
  if (R) passo(dt); anima(dt); camera(real); r.render(sc, cam);
});
</script></body></html>
