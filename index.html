<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>New Game Anime — vila de teste</title>
<style>
  :root{--bg:#9fc7e8;--fg:#f4f6fb;--glass:rgba(20,26,40,.55);--line:rgba(255,255,255,.28);--accent:#f0a83a;--ink:#16130e;color-scheme:dark}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas{display:block;touch-action:none}
  button{font:inherit;cursor:pointer;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 10px;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  #top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;
    padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
  #chars{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  #chars::-webkit-scrollbar{display:none}
  #chars button{font-size:12px;padding:6px 9px}
  #info{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));font-size:12px;opacity:.85;text-shadow:0 1px 2px #0008}
  /* joystick */
  #stick{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;
    background:var(--glass);border:1px solid var(--line);pointer-events:none}
  #knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
  /* botões de ação */
  #acts{position:fixed;inset:0;pointer-events:none}
  #acts button{pointer-events:auto}
  #acts button{position:absolute;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:600;font-size:12px}
  #bJump{width:80px;height:80px;font-size:14px!important}
  #bAtk{width:70px;height:70px;font-size:13px!important;background:rgba(150,40,40,.6)!important}
  #bDash,#acts .sk{width:54px;height:54px}
  #acts .sk.off{display:none}
  #bEsq{width:56px;height:56px}
  #acts button.semmana{animation:semmana .35s}
  @keyframes semmana{0%,100%{translate:0}25%{translate:-4px}75%{translate:4px}}
  /* vida e mana */
  #vida{position:fixed;left:12px;top:46px;width:190px;display:flex;flex-direction:column;gap:4px;pointer-events:none;filter:drop-shadow(0 1px 2px #0008)}
  #vida .bar{position:relative;height:14px;border-radius:7px;background:rgba(10,12,20,.6);border:1px solid rgba(255,255,255,.35);overflow:hidden}
  #vida .bar i{position:absolute;inset:0;transform-origin:left;transition:transform .15s}
  #vida #hpB i{background:linear-gradient(90deg,#c9302c,#ff6b5a)} #vida #mpB i{background:linear-gradient(90deg,#2d63d6,#5fb2ff)}
  #vida .bar span{position:absolute;inset:0;font:700 10px/14px system-ui,sans-serif;padding-left:7px;text-shadow:0 1px 1px #000}
  #vida #mpB.pisca{animation:pisca .4s 2} @keyframes pisca{50%{border-color:#ffd23a;box-shadow:0 0 8px #ffd23a}}
  #dor{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(220,30,20,.55);opacity:0;transition:opacity .35s}
  #caiu{position:fixed;inset:0;display:none;place-items:center;font:800 26px system-ui,sans-serif;text-shadow:0 2px 6px #000;background:rgba(40,0,0,.35);pointer-events:none}
  /* editor de botões */
  #hudp{display:none;position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:rgba(18,22,34,.92);border:1px solid var(--line);
    border-radius:14px;padding:8px 12px;flex-direction:column;gap:6px;align-items:center;box-shadow:0 6px 24px #0008;max-width:calc(100vw - 20px)}
  #hudp b{font-size:14px;color:#ffe7a8} #hudp small{font-size:11.5px;opacity:.8;text-align:center}
  #hudp .hrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center} #hudp button{font-size:12px;padding:6px 10px}
  body.edit #hudp{display:flex} body.edit #top,body.edit #menu,body.edit #cfg,body.edit #info,body.edit #help,body.edit #nums{display:none!important}
  body.edit [data-hud]{pointer-events:auto!important;outline:2px dashed rgba(255,231,168,.75);outline-offset:3px;cursor:grab;touch-action:none}
  body.edit [data-hud].sel{outline:3px solid #7fdc68}
  #acts .sk{background:rgba(60,40,110,.6);font-size:10px!important;line-height:1.05;text-align:center}
  #acts .sk[data-cd]::after{content:attr(data-cd);position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:15px;font-weight:700}
  #top #bSlow,#top #bRun,#top #bMenu,#top #bFull{font-size:12px;padding:6px 10px;flex:none}
  #top #bFull{font-size:15px;padding:4px 10px}
  #top #esp{flex:1} #top #bMenu{font-size:13px;padding:6px 12px}
  #top #bGal{flex:none}
  #cfg{position:fixed;inset:0;z-index:15;background:rgba(5,8,16,.45);display:grid;place-items:center}
  #cfg[hidden]{display:none}
  #cfg .caixa{width:min(860px,calc(100vw - 24px));height:calc(100vh - 20px);max-height:520px;display:flex;flex-direction:column;background:rgba(20,26,40,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px #000a;overflow:hidden}
  #cfg .cab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
  #cfg .cab b{font-size:15px;color:#ffe7a8;flex:none}
  #cfg .abas{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none} #cfg .abas::-webkit-scrollbar{display:none}
  #cfg .abas button,#cfg .cab #cfgX{font-size:12.5px;padding:6px 11px;flex:none}
  #cfg .corpo{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #cfg .apar{display:flex;gap:14px;height:100%} #cfg .apar .lado{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  #cfg .seg{display:flex;gap:6px} #cfg .seg button{flex:1}
  #grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;overflow-y:auto;padding:2px}
  #grade button{padding:0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;background:rgba(60,72,100,.55)}
  #grade button img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:linear-gradient(#3a4a6a,#24304a)}
  #grade button span{font-size:11px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #grade button.on{outline:3px solid var(--accent);outline-offset:-1px;background:rgba(240,168,58,.35)}
  #cores{overflow-y:auto} #cores h4{margin:4px 0 4px;font-size:12.5px;font-weight:700;opacity:.9}
  #cores .sw{display:flex;flex-wrap:wrap;gap:6px}
  #cores .sw button{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.35)}
  #cores .sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  #cores .sw button.orig{width:auto;border-radius:15px;padding:0 10px;font-size:11px}
  #cfg .lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  #cfg .lin>span{font-size:12px;opacity:.85;min-width:92px}
  #cfg .lin button{font-size:12.5px}
  #cfg h3{font-size:13px;margin:6px 0 8px;color:#ffe7a8}
  #cfg p.dica{font-size:11.5px;opacity:.75;margin:0 0 10px}
  #menu{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px));max-width:min(320px,calc(100vw - 36px));
    display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  #menu button{font-size:12px}
  #menu[hidden]{display:none}
  #menu .lin{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;width:100%}
  #menu .lin span{font-size:11px;opacity:.85;text-shadow:0 1px 2px #0008;margin-right:2px}
  #zoom{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
  #zoom button{width:46px;height:46px;border-radius:50%;padding:0;font-size:24px;line-height:1;display:grid;place-items:center}
  #zoom #bSlow{font-size:13px;font-weight:700}
  #nums div{position:fixed;left:0;top:0;font:800 20px system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #b2321f,0 0 6px #000a;pointer-events:none;will-change:transform}
  #nums div.crit{color:#ffd23a;font-size:28px}
  #help{transition:opacity 1s;position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;opacity:.7;text-shadow:0 1px 2px #0008;pointer-events:none}
  @media (hover:hover) and (pointer:fine){ #help{opacity:.85} }
</style></head>
<body>
<div id="top"><button id="bMenu" aria-label="Menu">☰ Menu</button><span id="esp"></span><button id="bSlow" aria-label="Câmera lenta">1x</button><button id="bRun">Correr</button><button id="bFull" aria-label="Tela cheia">⛶</button></div>
<div id="info">carregando…</div>
<div id="vida" data-hud="vida"><div class="bar" id="hpB"><i></i><span>HP 100/100</span></div><div class="bar" id="mpB"><i></i><span>MP 100/100</span></div></div>
<div id="dor"></div><div id="caiu">Você caiu…</div>
<div id="stick" data-hud="stick"><div id="knob"></div></div>
<div id="acts">
  <button data-hud="bS3" id="bS3" class="sk">Magia</button>
  <button data-hud="bS2" id="bS2" class="sk">Investida</button>
  <button data-hud="bS1" id="bS1" class="sk">Salto<br>giratório</button>
  <button data-hud="bS4" id="bS4" class="sk off"></button>
  <button data-hud="bS5" id="bS5" class="sk off"></button>
  <button data-hud="bS6" id="bS6" class="sk off"></button>
  <button data-hud="bS7" id="bS7" class="sk off"></button>
  <button data-hud="bS8" id="bS8" class="sk off"></button>
  <button data-hud="bS9" id="bS9" class="sk off"></button>
  <button data-hud="bEsq" id="bEsq">Esquiva</button>
  <button data-hud="bDash" id="bDash">Dash</button>
  <button data-hud="bAtk" id="bAtk">Atacar</button>
  <button data-hud="bJump" id="bJump">Pular</button>
</div>
<div id="nums"></div>
<div id="hudp"><b>✥ Ajustar botões</b><div class="hrow" id="hudesq"></div><small id="hudsel">Toque num botão pra escolher e arraste pra mover</small>
<div class="hrow"><button id="hudm">− Menor</button><button id="hudpl">+ Maior</button></div>
<div class="hrow"><button id="hudr">Restaurar este esquema</button><button id="hudok" class="on">Pronto</button></div></div>
<div id="cfg" hidden><div class="caixa">
  <div class="cab"><b>Configurações</b><div class="abas"><button data-aba="apar" class="on">Aparência</button><button data-aba="skills">Skills e botões</button><button data-aba="mov">Movimentos</button><button data-aba="anim">Animações</button><button id="cfgGal">Galeria</button></div><button id="cfgX" aria-label="Fechar">✕</button></div>
  <div class="corpo">
    <div data-pag="apar"><div class="apar"><div class="lado"><div class="seg"><button data-sexo="F" class="on">Femininos</button><button data-sexo="M">Masculinos</button></div><div id="grade"></div></div><div class="lado" id="cores"></div></div></div>
    <div data-pag="skills" hidden></div><div data-pag="mov" hidden></div><div data-pag="anim" hidden></div>
  </div></div></div>
<div id="help">arraste: câmera · pinça: zoom · ande contra paredes de pedra pra escalar · pule 2x: mortal</div>
<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/vrm_char.js"></script>
<script>
// Vila de teste do New Game Anime: anda, corre, pula, cambalhota, dash e animações, com a física de cabelo/roupa.
// Só pra testar personagens e movimentos; não tem NPC nem missão.
const PERS = [ // arquivo, nome, F/M
  ['sendagaya_shino', 'Shino', 'F'], ['sendagaya_shibu', 'Shibu', 'F'], ['darkness_shibu', 'Darkness Shibu', 'F'], ['sakurada_fumiriya', 'Fumiriya', 'M'],
  ['victoria_rubin', 'Victoria Rubin', 'F'], ['vita', 'Vita', 'F'], ['vivi', 'Vivi', 'F'], ['hairsample_female', 'Moça (moletom)', 'F'], ['hairsample_male', 'Rapaz (moletom)', 'M'],
  ['avatarsample_a', 'Avatar A', 'F'], ['avatarsample_b', 'Avatar B', 'F'], ['avatarsample_c', 'Avatar C', 'M'],
];
const EXTRAS = [['Melee_1H_Attack_Slice_Diagonal', 'Ataque'], ['Melee_2H_Attack_Spin', 'Giro'], ['Melee_Block', 'Defesa'], ['Ranged_Magic_Shoot', 'Magia'],
  ['Ranged_Magic_Summon', 'Invocar'], ['Ranged_Magic_Raise', 'Curar'], ['Interact', 'Interagir'], ['PickUp', 'Pegar'], ['Chopping', 'Machado'],
  ['Pickaxing', 'Picareta'], ['Hit_A', 'Dano'], ['Death_A', 'Morte'], ['Sit_Floor_Idle', 'Sentar'], ['Sit_Chair_Idle', 'Sentar (cadeira)']];
const LOOP_EXTRA = new Set(['Sit_Floor_Idle', 'Sit_Chair_Idle', 'Melee_Block']);
// números do Quimera Sandbox, onde o personagem tem 2,42 de altura; aqui tudo é multiplicado por K = altura real / 2,42,
// pra o movimento ter o mesmo ritmo (passada, pulo, dash e cambalhota na mesma proporção do corpo)
const Q = { WALK: 2.2, RUN: 4.6, GRAV: 17, JUMPV: 7.2, DASH_V: 15, FLIP_D: 1.02, DASH_UP: 0.55 }, ALT_Q = 2.42;
let K = 0.64, WALK, RUN, GRAV, JUMPV, DASH_V, FLIP_D, DASH_UP;
function escala(k) { K = k; WALK = Q.WALK * k; RUN = Q.RUN * k; GRAV = Q.GRAV * k; JUMPV = Q.JUMPV * k; DASH_V = Q.DASH_V * k; FLIP_D = Q.FLIP_D * k; DASH_UP = Q.DASH_UP * k }
escala(K);
const FLIP_T = 0.56, DASH_T = 0.2, RAD = 0.32, STEP = 0.45;

// ---------------- cena ----------------
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.outputEncoding = THREE.sRGBEncoding;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; document.body.prepend(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x9fc7e8); sc.fog = new THREE.Fog(0x9fc7e8, 40, 95);
sc.add(new THREE.HemisphereLight(0xeef3ff, 0x4a6a38, 0.75));
const sol = new THREE.DirectionalLight(0xfff1d6, 0.85); sol.castShadow = true; sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); sol.shadow.bias = -0.0005; sc.add(sol, sol.target);
const cam = new THREE.PerspectiveCamera(50, 1, 0.03, 140);
function tam() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() } addEventListener('resize', tam); tam();

const M = c => new THREE.MeshLambertMaterial({ color: new THREE.Color(c).convertSRGBToLinear() });
const mat = { grama: M(0x7fb35a), terra: M(0xc9a978), pedra: M(0xb9b4ac), parede: M(0xf1e6d2), madeira: M(0x8a5a36), telhaV: M(0xc4553e),
  telhaA: M(0x4f78b8), telhaT: M(0x3f8a6a), porta: M(0x6b4226), tronco: M(0x7a5233), folha: M(0x4f9a4a), folha2: M(0x6bb04f), agua: M(0x5aa7d8), caixa: M(0xb98a52), cerca: M(0xa77b4f) };
function malha(g, m, x, y, z, sombra = true) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = sombra; o.receiveShadow = true; sc.add(o); return o }

// chão e caminhos
const chao = malha(new THREE.PlaneGeometry(80, 80), mat.grama, 0, 0, 0, false); chao.rotation.x = -Math.PI / 2;
for (const [w, d] of [[3, 56], [56, 3]]) { const p = malha(new THREE.PlaneGeometry(w, d), mat.terra, 0, 0.01, 0, false); p.rotation.x = -Math.PI / 2 }
const praca = malha(new THREE.CircleGeometry(5.5, 40), mat.pedra, 0, 0.015, 0, false); praca.rotation.x = -Math.PI / 2;

// colisão: caixas no plano (x, z, meia-largura, meia-profundidade, topo). topo baixo = dá pra subir/pular em cima
const SOL = [];
function bloco(x, z, w, d, h, m, y0 = 0) { const o = malha(new THREE.BoxGeometry(w, h, d), m, x, y0 + h / 2, z); SOL.push({ x, z, hw: w / 2, hd: d / 2, top: y0 + h, climb: 'parede' }); return o } // tudo que é bloco dá pra escalar

// casinhas
function casa(x, z, w, d, rot, telha) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; sc.add(g);
  const add = (geo, m, px, py, pz) => { const o = new THREE.Mesh(geo, m); o.position.set(px, py, pz); o.castShadow = o.receiveShadow = true; g.add(o); return o };
  add(new THREE.BoxGeometry(w, 2.6, d), mat.parede, 0, 1.3, 0);
  const tel = add(new THREE.CylinderGeometry(0.01, Math.max(w, d) * 0.78, 1.8, 4, 1), telha, 0, 3.5, 0); tel.rotation.y = Math.PI / 4; tel.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d));
  add(new THREE.BoxGeometry(1, 1.7, 0.08), mat.porta, 0, 0.85, d / 2 + 0.04);
  for (const s of [-1, 1]) add(new THREE.BoxGeometry(0.7, 0.6, 0.08), mat.agua, s * w * 0.3, 1.6, d / 2 + 0.04);
  const c = Math.abs(Math.cos(rot)) > 0.5; // paredes escaláveis; o telhado (pirâmide) dá pra pisar
  SOL.push({ x, z, hw: (c ? w : d) / 2, hd: (c ? d : w) / 2, top: 2.6, climb: 'parede', teto: { h: 1.8, hw: 0.55 * (c ? w : d), hd: 0.55 * (c ? d : w) } });
}
casa(-9, -9, 5, 4, 0, mat.telhaV); casa(9, -9, 4.5, 4.5, 0, mat.telhaA); casa(-10, 9, 4, 5, Math.PI, mat.telhaT);
casa(10, 10, 5, 4, Math.PI, mat.telhaV); casa(-20, -2, 4, 4, Math.PI / 2, mat.telhaA); casa(20, 3, 4.5, 4, -Math.PI / 2, mat.telhaT);

// fonte na praça
bloco(0, 0, 2.6, 2.6, 0.55, mat.pedra); malha(new THREE.BoxGeometry(2.1, 0.05, 2.1), mat.agua, 0, 0.56, 0, false);
bloco(0, 0, 0.5, 0.5, 1.5, mat.pedra, 0.55);

// caixotes e escadinha pra testar pulo e degrau
bloco(5, 4, 0.9, 0.9, 0.8, mat.caixa); bloco(6.1, 4, 0.9, 0.9, 1.6, mat.caixa); bloco(6.1, 5.1, 0.9, 0.9, 0.8, mat.caixa);
for (let i = 0; i < 4; i++) bloco(-5 - i * 0.7, 5, 0.7, 2, 0.35 * (i + 1), mat.madeira);
bloco(-8.6, 5, 1.8, 2.6, 1.4, mat.madeira);
bloco(4.5, -5.5, 3, 0.4, 0.5, mat.madeira); // banco

// torre pra escalar (paredes escaláveis, topo plano), escada de mão na frente e muro pra correr na parede
const TORRE = { x: 0, z: -15, w: 4, d: 4, h: 6 }, LAD = { x: 1.2, z: TORRE.z + TORRE.d / 2 };
{ const o = malha(new THREE.BoxGeometry(TORRE.w, TORRE.h, TORRE.d), mat.pedra, TORRE.x, TORRE.h / 2, TORRE.z);
  SOL.push({ x: TORRE.x, z: TORRE.z, hw: TORRE.w / 2, hd: TORRE.d / 2, top: TORRE.h, climb: 'parede' });
  for (let i = 1; i < 6; i++) malha(new THREE.BoxGeometry(TORRE.w + 0.04, 0.06, TORRE.d + 0.04), mat.madeira, TORRE.x, i, TORRE.z, false); // faixas pra dar noção de altura
  for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) malha(new THREE.BoxGeometry(0.6, 0.5, 0.6), mat.pedra, TORRE.x + dx * 1.7, TORRE.h + 0.25, TORRE.z + dz * 1.7);
  for (const s of [-1, 1]) malha(new THREE.BoxGeometry(0.07, TORRE.h + 0.6, 0.07), mat.madeira, LAD.x + s * 0.28, (TORRE.h + 0.6) / 2, LAD.z + 0.12);
  for (let y = 0.3; y < TORRE.h + 0.5; y += 0.32) malha(new THREE.BoxGeometry(0.56, 0.05, 0.05), mat.madeira, LAD.x, y, LAD.z + 0.12, false);
